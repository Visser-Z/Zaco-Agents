const NEW_CODE = "__new__";   // sentinel option value in the code dropdown

/** Switch a row's code cell into "type a brand-new code" mode. */
function startNewCode(idx) { S.newCodeFor = idx; renderReview(); }
function cancelNewCode() { S.newCodeFor = null; renderReview(); }

/** Save a short code the operator just invented, then use it. */
async function saveNewCode(idx, raw) {
  const code = (raw || "").trim();
  if (!code) { toast("Type a short code first", true); return; }
  S.newCodeFor = null;
  await resolveCode(idx, code);
}

/** Resolve a flagged description by picking a code; remembered for next time.
 *  Applies to every pending row with the same product, since a batch usually
 *  carries several consignments of it and they all take the same code. */
async function resolveCode(idx, code) {
  if (!code) return;
  if (code === NEW_CODE) return startNewCode(idx);

  const row = S.pending[idx];
  const sameProduct = S.pending.filter(r => r.product && r.product === row.product);
  const targets = sameProduct.length ? sameProduct : [row];
  for (const r of targets) {
    r.description = code;
    r.flags = (r.flags || []).filter(f => f.field !== "description");
  }
  if (!S.codes.includes(code)) S.codes.push(code);

  if (S.live && row.product) {
    try {
      await api("/api/lookup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product: row.product, code }),
      });
    } catch (e) {
      toast("Used here, but could not save it for next time: " + e.message, true);
      renderReview();
      return;
    }
  }
  const also = targets.length > 1 ? ` · applied to ${targets.length} rows` : "";
  toast(`Saved “${code}” for this product${also}`);
  renderReview();
}

/** Correct a flagged numeric/text field inline. */
function editField(idx, field, raw) {
  const row = S.pending[idx];
  const value = raw.trim();
  if (value === "") return;
  if (field === "status") {
    row[field] = value;
  } else {
    // Anything that is not a number leaves the field unknown rather than
    // becoming 0: stripping the non-digits out of "n/a" leaves an empty string,
    // and Number("") is 0 -- which is how two rows ended up claiming to be
    // statement number 0. A zero statement or DN is not a correction, so the
    // flag stays on and the cell stays open for a real answer.
    const parsed = Number(value.replace(/[^\d.-]/g, ""));
    const unusable = !Number.isFinite(parsed)
      || ((field === "stm_no" || field === "dn") && parsed === 0);
    if (unusable) { renderReview(); return; }
    row[field] = parsed;
    // The DN belongs to the whole delivery, not to one account sale. Correcting
    // it on one row and leaving its siblings on the market's Supplier Ref is how
    // a delivery ends up split across two DNs in the sheet, so it carries over
    // to every row of the same delivery. The backend remembers it on save.
    if (field === "dn" && row.delivery_id != null) {
      for (const other of S.pending) {
        if (other !== row && other.delivery_id === row.delivery_id) {
          other.dn = parsed;
          other.flags = (other.flags || []).filter(f => f.code !== "dn_unproven");
        }
      }
    }
  }
  row.flags = (row.flags || []).filter(f => f.field !== field);
  renderReview();
}

// -------------------------------------------------------------- saving
const XLSX_TYPES = [{
  description: "Excel workbook",
  accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] },
}];

/** Get write permission for the open workbook WHILE THE CLICK IS STILL FRESH.
 *
 *  requestPermission() needs transient user activation, and a save spends the
 *  click uploading the whole workbook and waiting for it to come back. By the
 *  time the write ran, the activation was gone and the request threw
 *  NotAllowedError -- which the old code reported as "probably open in Excel",
 *  sending the operator to close a file that was not open. So it is asked for
 *  up front, before any network work. Returns true when writing can go ahead. */
async function ensureWritePermission() {
  const h = S.wbHandle;
  if (!h || !h.queryPermission) return true;   // download fallback handles it
  try {
    let p = await h.queryPermission({ mode: "readwrite" });
    if (p !== "granted") p = await h.requestPermission({ mode: "readwrite" });
    return p === "granted";
  } catch {
    return false;    // asked outside a gesture, or refused; the caller reports it
  }
}

// What the File System Access API actually throws, and what each one means for
// the person looking at the screen. Guessing "it's open in Excel" for all of
// them cost a real save.
const WRITE_FAILURES = {
  NotAllowedError: "denied",
  NoModificationAllowedError: "locked",
  NotFoundError: "gone",
  InvalidStateError: "changed",
  AbortError: "cancelled",
};

/** Write straight into the file S.wbHandle points at.
 *  Returns { done } on success, { done:false, reason } otherwise. */
async function writeInPlace(blob) {
  if (!S.wbHandle || !S.wbHandle.createWritable) return { done: false, reason: "nohandle" };
  try {
    if (S.wbHandle.queryPermission) {
      const p = await S.wbHandle.queryPermission({ mode: "readwrite" });
      if (p !== "granted") return { done: false, reason: "denied" };
    }
    const w = await S.wbHandle.createWritable();
    await w.write(blob);
    await w.close();
    return { done: true };
  } catch (e) {
    return { done: false, reason: WRITE_FAILURES[e && e.name] || "failed", error: e };
  }
}

/** Persist the blob: in place when possible, else ask where once (and keep the
 *  answer for every save after), else fall back to a download. Returns false
 *  when nothing was written and the changes must stay marked unsaved. */
async function persistWorkbook(blob) {
  const attempt = await writeInPlace(blob);
  if (attempt.done) {
    toast(`Saved to ${S.wb.name}`);
    return true;
  }
  // Why the direct write failed, in the operator's terms. Carried through to the
  // end rather than toasted now, because a second toast replaces the first and
  // the last one would otherwise claim the browser cannot save to files at all.
  const why = {
    locked: `${S.wb.name} is locked by another program, usually Excel.`,
    denied: `The browser wasn’t allowed to write to ${S.wb.name}.`,
    gone: `${S.wb.name} isn’t where it was: moved, renamed or deleted.`,
    changed: `${S.wb.name} changed on disk since you opened it, so writing over it `
           + `would throw that change away.`,
    failed: `Couldn’t write to ${S.wb.name}`
          + (attempt.error && attempt.error.message ? `: ${attempt.error.message}` : "") + ".",
    nohandle: "",   // a new workbook, or one opened without the file picker
  }[attempt.reason] || "";

  // Ask where to put it instead. This needs a fresh click too, so it can fail on
  // its own; the download below is the floor that always works, and is why a
  // round can never be lost here. The rows exist only in this blob.
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: S.wb.name === "Untitled.xlsx" ? "ZacoAgents.xlsx" : S.wb.name,
        types: XLSX_TYPES,
      });
      S.wbHandle = handle;
      S.wb.name = handle.name;
      if ((await writeInPlace(blob)).done) {
        toast(why ? `${why} Saved to ${handle.name} instead.` : `Saved to ${handle.name}`);
        return true;
      }
    } catch (e) {
      if (e && e.name === "AbortError") {
        toast(`${why} Save cancelled, so your changes are still here, unsaved.`.trim(), true);
        return false;
      }
      // Fall through to the download on anything else.
    }
  }
  downloadBlob(blob, S.wb.name);
  toast(why
    ? `${why} Downloaded ${S.wb.name} to your Downloads folder instead, so nothing is lost.`
    : `This browser can’t save directly to a file, so ${S.wb.name} was downloaded instead.`, !!why);
  return true;
}

async function saveWorkbook() {
  const fresh = S.committed.filter(r => !r.existing);
  if (!fresh.length) { toast("Nothing new to save"); return; }

  // Before anything slow. The upload below spends the click that the browser
  // requires in order to ask about file access, so asking afterwards fails.
  await ensureWritePermission();

  if (!S.live) {
    S.committed = S.committed.map(r => ({ ...r, existing: true, isNew: false }));
    S.saved = true;
    setStep(3); toast(`Saved ${S.committed.length} rows to ${S.wb.name}`);
    renderHub();
    return;
  }

  await withBusy(`Saving ${S.wb.name}…`, async () => {
    // Re-read the workbook from disk right before uploading. The File taken at
    // open time is a snapshot; if the file changed since (saved in Excel, a
    // previous in-place write), Chrome refuses to read the stale snapshot with
    // "state had changed since it was read from disk". A fresh read also means
    // rows added in Excel meanwhile are preserved by the append.
    if (S.wbHandle && S.wbHandle.getFile) {
      try { S.wbFile = await S.wbHandle.getFile(); }
      catch { /* keep the cached copy; the write step will surface any problem */ }
    }
    const fd = new FormData();
    fd.append("rows", JSON.stringify(fresh));
    fd.append("market_agent", S.agent);
    if (S.wbFile) fd.append("file", S.wbFile, S.wb.name);
    let blob, historyWarning = null;
    try {
      const res = await api("/api/workbook/append", { method: "POST", body: fd });
      // Recording history for Insights is best-effort on the server; if it
      // failed, the workbook still comes back and we flag it non-blockingly.
      historyWarning = res.headers.get("X-History-Warning");
      blob = await res.blob();
    } catch (e) {
      // Reading the workbook for upload can fail if the file is locked or
      // still changing on disk -- surface that as something actionable
      // instead of Chrome's "state had changed since it was read from disk".
      if (e && (e.name === "InvalidStateError" || e.name === "NotReadableError"
                || /state had changed|not be read/i.test(e.message || ""))) {
        throw new Error(`Couldn’t read ${S.wb.name} from disk — close it in Excel, then press Save again.`);
      }
      throw e;
    }

    if (!(await persistWorkbook(blob))) {
      // User cancelled the save dialog: keep everything marked unsaved.
      S.screen = "hub";
      return;
    }

    // Those rows now live in the file: keep them, but never re-append them.
    S.wbFile = blob;
    S.committed = S.committed.map(r => ({ ...r, existing: true, isNew: false }));
    S.saved = true;
    S.screen = "hub";
    if (historyWarning) toast(historyWarning, true);
  });
  if (S.saved) { setStep(3); noteBuyChanges(); }
}

/** New sales change what is worth buying, so the app says what moved rather
 *  than waiting to be asked. Diffed against the levels held before the save;
 *  only promotions are reported, since a line falling back is not something to
 *  act on this morning. */
async function noteBuyChanges() {
  const B = S.buys;
  if (!S.live) return;
  const before = {};
  for (const r of (B.data?.recommendations || [])) before[r.product] = r.level;

  B.data = null; B.tried = false; B.costs = null;   // history moved underneath them
  try { B.data = await (await api("/api/procurement")).json(); }
  catch { return; }                                 // never let this break a save
  syncBuyBadge();

  const RANK = { low: 0, high: 1, critical: 2 };
  const moved = [];
  for (const r of (B.data.recommendations || [])) {
    const was = before[r.product];
    if (was === undefined) {
      // Brand new to the list. Only worth mentioning if it arrived worth buying.
      if (r.level !== "low") moved.push({ product: r.product, to: r.level, fresh: true });
    } else if (RANK[r.level] > RANK[was]) {
      moved.push({ product: r.product, to: r.level, from: was });
    }
  }
  B.changes = moved.length ? moved : null;
  if (moved.length) {
    toast(`${moved.length} line${moved.length === 1 ? "" : "s"} moved up your list`);
  }
  render();
}

function dismissBuyChanges() { S.buys.changes = null; render(); }

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// --------------------------------------------------------------- table
function tableBlock(rows, { editable }) {
  const pool = rows;
  const sorted = [...rows].map((r, i) => ({ r, i }))
    .sort((a, b) => (a.r.dn ?? 0) - (b.r.dn ?? 0) || (a.r.stm_no ?? 0) - (b.r.stm_no ?? 0));

  let html = "", lastDn = Symbol("none");
  for (const { r, i } of sorted) {
    if (r.dn !== lastDn) {
      lastDn = r.dn;
      html += `<tr class="group-row"><td colspan="${COLS.length}">
        <span class="dn num">DN ${r.dn ?? "—"}</span>
        <span class="meta"> · ${esc(r.market_agent || S.agent)}</span>
        <span class="date-badge">Date <span class="num">${groupDate(r.dn, pool)}</span></span>
        ${r.existing ? '<span class="tag existing">in workbook</span>' : (editable ? "" : '<span class="tag new">added</span>')}
      </td></tr>`;
    }
    html += `<tr class="${!editable ? "" : (needsAttention(r) ? "attn" : "")} ${r.existing ? "existing" : ""}">`
      + COLS.map(c => cellHtml(c, r, i, pool, editable)).join("") + "</tr>";
  }

  const legend = `<div class="legend">
    <span><span class="sw" style="background:var(--surface-2);border:1px solid var(--line-strong)"></span> extracted / manual</span>
    <span><span class="fmark" style="font-style:italic">ƒ</span> template formula (auto-calculated)</span>
    ${editable ? '<span><span class="sw" style="background:var(--warn-tint);border:1px solid var(--warn)"></span> needs attention</span>' : ""}
  </div>`;

  return legend + `<div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>${COLS.map(c => `<th class="${c.cls || ""} ${c.f ? "f" : ""}">${c.h}${c.f ? ' <span class="fmark">ƒ</span>' : ""}</th>`).join("")}</tr></thead>
    <tbody>${html}</tbody></table></div></div>`;
}

function cellHtml(c, r, i, pool, editable) {
  if (c.desc) {
    const raw = r.product ? `<span class="prod-raw" title="${esc(r.product)}">${esc(r.product)}</span>` : "";
    if (editable) {
      // Naming a brand-new code for this row: the picker becomes a text box.
      // New products arrive constantly, so this has to be quick, not a detour.
      if (S.newCodeFor === i) {
        return `<td class="flagged">
          <span class="newcode">
            <input class="cell-input newcode-in" id="newCode${i}" placeholder="New short code…"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();saveNewCode(${i}, this.value);}
                              else if(event.key==='Escape'){cancelNewCode();}">
            <button class="btn primary sm" onclick="saveNewCode(${i}, document.getElementById('newCode${i}').value)">Save</button>
            <button class="btn ghost sm" onclick="cancelNewCode()">Cancel</button>
          </span>
          ${raw}<span class="flag-note">Give it a short code, e.g. “Imp Granadillas”. It's remembered for next time.</span></td>`;
      }
      // Otherwise a dropdown, pre-selected to the auto-picked code so it self-
      // selects but stays changeable. The current code is included even if it
      // isn't in the known list yet. Only flag when nothing was picked.
      const options = [...new Set([...(r.description ? [r.description] : []), ...S.codes])];
      const opts = `<option value="">Pick code…</option>`
        + options.map(k => `<option${k === r.description ? " selected" : ""}>${esc(k)}</option>`).join("")
        + `<option value="${NEW_CODE}">＋ New code…</option>`;
      const note = r.description
        ? ""
        : `<span class="flag-note">No short code on file. Pick one, or add a new code.</span>`;
      return `<td class="${r.description ? "" : "flagged"}">
        <select class="mini-select${r.description ? " set" : ""}" onchange="resolveCode(${i}, this.value)">${opts}</select>
        ${raw}${note}</td>`;
    }
    return `<td><b>${esc(r.description || "—")}</b>${buyChip(r.product || r.description)}${raw}</td>`;
  }

  const flag = c.field ? flagFor(r, c.field) : null;
  if (flag && editable) {
    // Error flags block the append until resolved; warning flags are advisory
    // (the value below already stands -- e.g. a nett left at 0) but stay
    // editable so the share can be typed in right here.
    const current = r[c.field];
    return `<td class="${c.cls || ""} flagged">
      <input class="cell-input" value="${current == null ? "" : esc(current)}" placeholder="—"
             onchange="editField(${i}, '${c.field}', this.value)">
      <span class="flag-note">${esc(flag.message)}</span></td>`;
  }
  // The statement number is where an agent-watch flag belongs on this screen:
  // it is the cell the concern is about, and it puts the question in front of
  // the operator while they are still looking at the round.
  if (c.field === "stm_no") {
    return `<td class="${c.cls || ""}">${c.get(r, pool)}${watchChip(r.stm_no)}</td>`;
  }
  return `<td class="${c.cls || ""} ${c.f ? "f" : ""}">${c.get(r, pool)}</td>`;
}

// ------------------------------------------------------- toast + theme
let toastT;
function toast(msg, bad) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastT);
  toastT = setTimeout(() => t.remove(), bad ? 5200 : 2600);
}
// -------------------------------------------------------- file inputs
const wbInput = document.getElementById("wbInput");
wbInput.addEventListener("change", e => {
  const f = e.target.files[0];
  wbInput.value = "";
  if (f) openWorkbook(f);
});
const pdfInput = document.getElementById("pdfInput");
pdfInput.addEventListener("change", e => {
  const files = [...e.target.files];
  pdfInput.value = "";
  if (files.length) onPdfFiles(files);
});
const paymentInput = document.getElementById("paymentInput");
paymentInput.addEventListener("change", e => {
  const files = [...e.target.files];
  paymentInput.value = "";
  if (files.length) onPaymentFiles(files);
});

// ------------------------------------------------------- drag and drop
// Dropping works anywhere on the page: statement PDFs land in the current
// round, a workbook dropped on the setup screen opens it. Dropped workbooks
// keep a file handle where the browser supports it, so Save still writes
// straight back to the original file.
// PDF or CSV: the CSV exports of the same reports are preferred where
// available, since their values are read rather than recovered from layout.
const isPdf = f => /\.(pdf|csv)$/i.test(f.name) || f.type === "application/pdf" || f.type === "text/csv";
const isWorkbook = f => /\.(xlsx|xlsm)$/i.test(f.name);

let dragDepth = 0;
function dropHighlight(on) {
  document.querySelectorAll(".drop").forEach(el => el.classList.toggle("over", on));
}
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragenter", e => {
  if ([...(e.dataTransfer?.types || [])].includes("Files")) {
    dragDepth++;
    dropHighlight(true);
  }
});
document.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; dropHighlight(false); }
});
document.addEventListener("drop", async e => {
  e.preventDefault();
  dragDepth = 0;
  dropHighlight(false);

  const authShowing = !document.getElementById("authWrap")?.hidden;
  if (authShowing && S.authRequired) return;   // nothing to drop onto before sign-in

  // dataTransfer.items is cleared after the first await, so anything we need
  // from it -- the files and any file handles -- must be captured up front.
  const items = [...(e.dataTransfer?.items || [])];
  const files = [...(e.dataTransfer?.files || [])];
  if (!files.length) return;
  const handlePromises = items.map(i =>
    i.kind === "file" && i.getAsFileSystemHandle
      ? i.getAsFileSystemHandle().catch(() => null)
      : Promise.resolve(null)
  );
  const itemNames = items.map(i => (i.kind === "file" ? i.getAsFile()?.name : null));

  const pdfs = files.filter(isPdf);
  const books = files.filter(isWorkbook);

  if (books.length && S.screen === "setup") {
    // Reattach the dropped workbook's file handle when the browser offers
    // one, so Save writes straight back to the same file.
    const idx = itemNames.indexOf(books[0].name);
    const handle = idx >= 0 ? await handlePromises[idx] : null;
    await openWorkbook(books[0], handle && handle.kind === "file" ? handle : null);
    return;
  }

  if (pdfs.length) {
    if (S.module !== "sales" || !S.wb) {
      toast("Open a workbook first, then drop the statement PDFs in");
      return;
    }
    onPdfFiles(pdfs);
    return;
  }

  toast(books.length
    ? "To switch workbook, go to “Switch workbook” first, then drop it there"
    : "Drop statement PDFs, or an .xlsx workbook on the opening screen");
});

// ------------------------------------------------------------- start
/** Runs once a session exists (or auth is off): loads data and shows the app. */
async function startApp() {
  const wrap = document.getElementById("authWrap");
  if (wrap) wrap.hidden = true;
  document.querySelector(".app").hidden = false;

  if (S.authRequired) {
    try {
      const me = await (await api("/api/me")).json();
      Auth.profile = me;
    } catch {
      // Not fatal: the app still works, we just cannot show the role badge.
      Auth.profile = null;
    }
  }
  showUserChip();
  await loadCodes();
  render();
}

(async function init() {
  await checkHealth();

  if (!S.authRequired) {
    // Demo mode, or a local run with auth switched off.
    await startApp();
    return;
  }

  Auth.load();

  // An invite or password-reset link arrives with tokens in the fragment.
  const linkType = consumeAuthFragment();
  if (linkType) {
    renderAuth("invite", linkType === "recovery"
      ? "Choose a new password to finish resetting your account."
      : "Welcome — set a password to activate your account.");
    return;
  }

  if (await Auth.validToken()) await startApp();
  else renderAuth("signin");
})();
</script>
