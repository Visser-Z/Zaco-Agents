<title>ZacoAgents — Statement to Excel</title>
<style>
  /* Light only, one theme. Neutrals carry the interface; colour is reserved for
     things that genuinely need to be noticed -- primary actions, and the review
     states (matched / needs attention / error). Everything else stays grey so
     that when colour does appear, it means something. */
  :root {
    /* Cool neutral greys -- office software, not warm "document" cream. */
    --ground: #F5F6F8;      /* page behind the cards        */
    --surface: #FFFFFF;     /* cards, tables, bars          */
    --surface-2: #EFF1F4;   /* headers, insets, wells       */
    --ink: #16191F;         /* charcoal, deliberately not pure black */
    --ink-soft: #4C5461;
    --ink-faint: #858D9A;
    --line: #E2E5EA;
    --line-strong: #CBD1D9;

    /* Single accent: a restrained corporate blue for primary actions only. */
    --accent: #1F5FA8;
    --accent-strong: #17497F;
    --accent-tint: #E9F0F8;

    /* Semantic status. Green survives here as "correct", not as branding. */
    --ok: #1E7A4D;    --ok-tint: #E7F4EC;
    --warn: #9A6410;  --warn-tint: #FBF1DE;
    --crit: #B23B34;  --crit-tint: #FAE9E7;

    /* Flat and tight. Depth comes from borders, not from glow. */
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-lg: 0 4px 12px -2px rgba(16, 24, 40, .08), 0 2px 4px -2px rgba(16, 24, 40, .05);
    --radius: 8px;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  /* The `hidden` attribute is applied by the UA stylesheet as `display: none`,
     which any author rule outranks. Several elements here are `display: flex`
     (.app, .wb-pill, .user-chip), so without this they stay visible when
     hidden -- which put the login card *below* the dashboard instead of
     replacing it. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  ::selection { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 2px solid var(--ground); background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); background-clip: padding-box; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 0 22px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; font-size: 15.5px; }
  .brand .glyph { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 15px; }
  .brand .sub { color: var(--ink-faint); font-weight: 500; font-size: 12px; letter-spacing: .02em; }
  .topbar .spacer { flex: 1; }
  .wb-pill { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; font-size: 12.5px; }
  .wb-pill .fi { width: 22px; height: 22px; border-radius: 5px; background: var(--ink-soft); color: #fff; display: grid; place-items: center; font-size: 9px; font-weight: 700; }
  .wb-pill .v { font-weight: 600; }
  .wb-pill .n2 { color: var(--ink-faint); }
  .mode { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 650; }
  .mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .mode.live { color: var(--ok); background: var(--ok-tint); }
  .mode.demo { color: var(--warn); background: var(--warn-tint); }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; font-size: 15px; transition: background .15s, color .15s, transform .1s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn:active { transform: scale(.92); }

  .body { flex: 1; display: grid; grid-template-columns: 232px 1fr; }
  .rail { border-right: 1px solid var(--line); padding: 26px 18px; background: var(--surface); }
  .rail h2 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px 6px; font-weight: 650; }
  .rail .rail-sub { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }

  .modules { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .mod { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ink-soft); font-family: var(--sans); font-size: 13.5px; font-weight: 600; cursor: pointer; text-align: left; transition: background .15s, color .15s, border-color .15s; }
  .mod:hover { background: var(--surface-2); color: var(--ink); }
  .mod .mi { width: 24px; height: 24px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; color: var(--ink-faint); flex: none; transition: background .15s, color .15s; }
  .mod .mt { flex: 1; }
  .mod .mbadge { font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--ink-faint); }
  .mod.active { background: var(--accent-tint); color: var(--accent-strong); border-color: transparent; }
  .mod.active .mi { background: var(--accent); color: #fff; }

  .placeholder { text-align: center; padding: 64px 30px; }
  .placeholder .pi { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 26px; color: var(--ink-faint); }
  .placeholder h2 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.01em; }
  .placeholder p { margin: 0 auto; color: var(--ink-soft); max-width: 48ch; }
  .placeholder .stub { display: inline-flex; align-items: center; gap: 7px; margin-top: 22px; padding: 7px 14px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--ink-faint); font-weight: 600; }
  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .steps::before { content: ""; position: absolute; left: 21px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
  .step { display: flex; gap: 12px; align-items: flex-start; padding: 8px 6px; border-radius: 9px; position: relative; }
  .step .dot { width: 30px; height: 30px; border-radius: 50%; flex: none; z-index: 1; display: grid; place-items: center; font-size: 13px; font-weight: 650; background: var(--surface); border: 2px solid var(--line-strong); color: var(--ink-faint); }
  .step .lbl { padding-top: 4px; }
  .step .lbl .t { font-weight: 600; font-size: 13.5px; }
  .step .lbl .d { font-size: 11.5px; color: var(--ink-faint); }
  .step.done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.current { background: var(--accent-tint); }
  .step.current .dot { border-color: var(--accent); color: var(--accent); }
  .step.todo .lbl .t { color: var(--ink-soft); }
  .rail .loop-note { margin: 14px 8px 0; font-size: 11.5px; color: var(--ink-faint); display: flex; gap: 7px; align-items: flex-start; }

  .main { padding: 28px 30px 60px; overflow-x: hidden; }
  .screen { max-width: 1160px; margin: 0 auto; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .toast, .spin { animation: none; } }
  .head { margin-bottom: 22px; }
  .head h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 5px; text-wrap: balance; }
  .head p { margin: 0; color: var(--ink-soft); max-width: 64ch; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  .choice { text-align: left; padding: 22px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; font-family: var(--sans); color: var(--ink); }
  .choice:hover { border-color: var(--accent); background: var(--accent-tint); }
  .choice .ci { width: 42px; height: 42px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; color: var(--accent); margin-bottom: 12px; }
  .choice h3 { margin: 0 0 4px; font-size: 15px; }
  .choice p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .field { max-width: 340px; }
  .field label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 650; margin-bottom: 6px; }
  .field .req { color: var(--crit); }
  select, .input { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  select:focus, .input:focus, button:focus-visible, .drop:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }

  .wb-bar { display: flex; align-items: center; gap: 16px; padding: 16px 20px; margin-bottom: 18px; }
  .wb-bar .fi { width: 40px; height: 40px; border-radius: 8px; background: var(--ink-soft); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .wb-bar .fn { font-weight: 650; font-size: 15px; }
  .wb-bar .fm { font-size: 12.5px; color: var(--ink-faint); }
  .wb-bar .spacer { flex: 1; }

  .drop { border: 2px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface-2); padding: 34px 24px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover { border-color: var(--accent); background: var(--accent-tint); }
  .drop.over { border-color: var(--accent); background: var(--accent-tint); }
  .drop .big { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: 21px; color: var(--accent); }
  .drop .t { font-weight: 600; }
  .drop .s { font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }

  .empty { text-align: center; padding: 46px 24px; color: var(--ink-soft); }
  .empty .big { width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 22px; color: var(--ink-faint); }

  .actions { display: flex; gap: 12px; align-items: center; margin-top: 22px; }
  .actions .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 9px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s, transform .08s, box-shadow .15s; }
  .btn.sm { padding: 8px 13px; font-size: 13px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.primary:active { transform: translateY(1px); }
  .btn.primary:disabled { background: var(--line-strong); color: var(--ink-faint); cursor: not-allowed; }
  .btn.ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .btn.ghost:hover { background: var(--surface-2); border-color: var(--ink-faint); }
  .btn.ghost:active { transform: translateY(1px); }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-size: 23px; font-weight: 680; letter-spacing: -.02em; font-family: var(--mono); }
  .stat .l { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .stat.warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); background: var(--warn-tint); }
  .stat.warn .n { color: var(--warn); }

  .banner { display: flex; gap: 11px; align-items: flex-start; padding: 12px 15px; border-radius: 9px; background: var(--accent-tint); border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line)); font-size: 13px; margin-bottom: 18px; }
  .banner.bad { background: var(--crit-tint); border-color: color-mix(in srgb, var(--crit) 30%, var(--line)); }
  .banner.bad .bi { color: var(--crit); }
  .banner .bi { color: var(--accent); font-size: 15px; }
  .banner b { font-weight: 650; }
  .linklike { border: none; background: none; padding: 0; font: inherit; font-weight: 650; color: var(--crit); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .linklike:hover { color: var(--ink); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-faint); margin: 0 2px 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; }

  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1560px; font-size: 12.5px; }
  thead th { text-align: left; padding: 9px 11px; font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-faint); font-weight: 650; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
  thead th.n, tbody td.n { text-align: right; }
  th.f { color: color-mix(in srgb, var(--ink-faint) 80%, var(--accent)); }
  th .fmark, .fmark { color: var(--accent); font-weight: 700; }
  .group-row td { background: var(--surface-2); padding: 8px 11px; border-bottom: 1px solid var(--line); font-size: 12px; position: sticky; left: 0; }
  .group-row .dn { font-weight: 700; letter-spacing: -.01em; }
  .group-row .meta { color: var(--ink-soft); }
  .date-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line-strong); font-size: 11.5px; font-weight: 600; margin-left: 8px; }
  .date-badge .num { color: var(--accent); }
  .tag { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 650; letter-spacing: .03em; text-transform: uppercase; }
  .tag.existing { background: var(--surface-2); color: var(--ink-faint); }
  .tag.new { background: var(--accent); color: #fff; }
  tbody td { padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; transition: box-shadow .1s; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.attn td { background: var(--warn-tint); }
  tbody tr.existing td { color: var(--ink-faint); }
  tbody tr:not(.group-row):hover td { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--ink) 3%, transparent); }
  td.f { color: var(--ink-faint); font-style: italic; }
  td.flagged { box-shadow: inset 0 0 0 1px var(--warn); }
  .prod-raw { color: var(--ink-faint); font-size: 10.5px; font-family: var(--mono); display: block; margin-top: 1px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.ok { color: var(--ok); background: var(--ok-tint); }
  .chip.warn { color: var(--warn); background: var(--warn-tint); }
  .mini-select, .cell-input { padding: 5px 8px; border: 1px solid var(--warn); border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 12px; font-family: var(--sans); max-width: 140px; }
  .mini-select.set { border-color: var(--line-strong); }  /* auto-picked code reads as normal, not a warning */
  .cell-input { font-family: var(--mono); text-align: right; width: 96px; }
  .flag-note { display: block; margin-top: 2px; font-size: 10.5px; color: var(--warn); white-space: normal; max-width: 220px; }

  .spin { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .busy { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--ink-soft); }
  .busy .spin { border-color: var(--line-strong); border-top-color: var(--accent); width: 20px; height: 20px; }

  /* ---------- auth ---------- */
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ground); }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 32px 30px;
  }
  .auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; margin-bottom: 4px; }
  .auth-brand .glyph { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 16px; }
  .auth-card h1 { font-size: 19px; margin: 20px 0 4px; letter-spacing: -.015em; }
  .auth-card .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; line-height: 1.5; }
  .auth-form { display: flex; flex-direction: column; gap: 14px; }
  .auth-form label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 650; margin-bottom: 6px; }
  .auth-form input { width: 100%; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; transition: border-color .15s, box-shadow .15s; }
  .auth-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .auth-form .btn { justify-content: center; width: 100%; margin-top: 4px; }
  .auth-msg { display: flex; gap: 9px; align-items: flex-start; padding: 10px 13px; border-radius: 9px; font-size: 12.5px; line-height: 1.45; }
  .auth-msg.bad { background: var(--crit-tint); color: var(--crit); border: 1px solid color-mix(in srgb, var(--crit) 28%, transparent); }
  .auth-msg.info { background: var(--accent-tint); color: var(--accent-strong); border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent); }
  .auth-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-faint); line-height: 1.5; }

  .user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 6px 5px 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }
  .user-chip .who { font-weight: 600; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-chip .role { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--accent-tint); color: var(--accent-strong); }
  .user-chip button { border: none; background: none; color: var(--ink-faint); cursor: pointer; font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .user-chip button:hover { background: var(--surface); color: var(--ink); }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 9px; font-size: 13px; font-weight: 550; box-shadow: var(--shadow); z-index: 50; animation: rise .25s ease; max-width: 80vw; }
  .toast.bad { background: var(--crit); color: #fff; }
  /* -------- insights ------------------------------------------------- */
  .ins-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex: none; }
  .seg button { border: none; background: none; padding: 8px 14px; font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: background .15s, color .15s; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-tint); color: var(--accent-strong); }
  .seg.sm button { padding: 6px 11px; font-size: 12px; }
  /* -------- removable PDF chips -------------------------------------- */
  .pdf-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12.5px; max-width: 340px; }
  .pchip .pci { color: var(--ink-faint); font-size: 12px; flex: none; }
  .pchip .pcn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pchip .pcc { color: var(--ink-faint); font-size: 11.5px; flex: none; }
  .pchip .pcx { flex: none; width: 20px; height: 20px; border-radius: 5px; border: none; background: var(--surface-2); color: var(--ink-soft); font-size: 15px; line-height: 1; cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s; }
  .pchip .pcx:hover { background: var(--crit-tint); color: var(--crit); }

// ------------------------------------------------------------ formulas
// Mirrors the template so the review screen shows the sheet as it will look.
// The chain hangs on Frui Price/crt, exactly as the sheet does: the default is
// 70% of what the carton returned, which lands the row on a 30% commission, and
// in the workbook that one cell can be overwritten for a deal on other terms.
// The rate appears here once so the review screen can never drift from the sheet.
const COMMISSION = 0.30;
const grossTotal = r => num(r.cartons_sold) * num(r.price);
const babyStock  = r => num(r.opening_stock) - num(r.cartons_sold);
const nettPPC    = r => r.cartons_sold ? num(r.nett_total) / r.cartons_sold : 0;
const fruiPPC    = r => nettPPC(r) * (1 - COMMISSION);
const fruiCurr   = r => fruiPPC(r) * num(r.cartons_sold);
const zRPC       = r => nettPPC(r) - fruiPPC(r);
const zTotal     = r => num(r.nett_total) - fruiCurr(r);
const markup     = r => nettPPC(r) ? zRPC(r) / nettPPC(r) : 0;

const num = v => (typeof v === "number" ? v : 0);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = n => (typeof n === "number" ? n : 0).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function dateLabel(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.getUTCDate() + "-" + MONTHS[d.getUTCMonth()];
}
/** Column D: the earliest date across the DN group -- the day the load was sent
 *  where the export gives it, else when the market received it. The two differ
 *  by a day: the book dates the load going out, the market dates booking it in.
 *  Rows read back from a saved workbook carry only `date`, so fall back to that. */
function groupDate(dn, pool) {
  const rs = pool.filter(r => r.dn === dn);
  for (const field of ["date_sent", "date_received", "date"]) {
    const found = rs.map(r => r[field]).filter(Boolean).sort();
    if (found.length) return dateLabel(found[0]);
  }
  return "—";
}
const errFlags = r => (r.flags || []).filter(f => f.severity !== "warning");
const needsAttention = r => errFlags(r).length > 0 || !r.description;
const flagFor = (r, field) => (r.flags || []).find(f => f.field === field);
// A row already in the saved history: the backend marks it with a warning flag
// on the statement number, so appending it again would duplicate it in Excel.
// Keyed on the flag's code, not just its field -- a row that has sold but is not
// in a payment run yet also flags the statement number, and reading that as a
// duplicate would warn about every unpaid row.
const isDuplicate = r => (r.flags || []).some(f => f.code === "duplicate");

// ---------------------------------------------------------------- auth
// Talks to Supabase Auth (GoTrue) over its REST API directly. No SDK: the app
// ships as a single file with no external scripts, and the four calls we need
// are a few lines each.
const Auth = {
  cfg: { url: "", key: "" },   // from /api/health
  session: null,               // { access_token, refresh_token, expires_at, user }
  profile: null,               // { role, email } from the backend
  STORAGE: "zacon.session",

  load() {
    try { this.session = JSON.parse(localStorage.getItem(this.STORAGE) || "null"); }
    catch { this.session = null; }
    return this.session;
  },
  store(session) {
    this.session = session;
    if (session) localStorage.setItem(this.STORAGE, JSON.stringify(session));
    else localStorage.removeItem(this.STORAGE);
  },

  async gotrue(path, { method = "POST", body, token } = {}) {
    const res = await fetch(`${this.cfg.url}/auth/v1/${path}`, {
      method,
      headers: {
        apikey: this.cfg.key,
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error_description || data.msg || data.message || "Sign in failed");
    }
    return data;
  },

  async signIn(email, password) {
    const d = await this.gotrue("token?grant_type=password", { body: { email, password } });
    this.store({
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
      user: d.user,
    });
    return this.session;
  },

  /** Used by invite and password-reset links, which arrive already authenticated. */
  async setPassword(password) {
    const d = await this.gotrue("user", {
      method: "PUT", body: { password }, token: this.session.access_token,
    });
    this.session.user = d;
    this.store(this.session);
  },

  async refresh() {
    if (!this.session?.refresh_token) return null;
    try {
      const d = await this.gotrue("token?grant_type=refresh_token", {
        body: { refresh_token: this.session.refresh_token },
      });
      this.store({
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
        user: d.user,
      });
      return this.session;
    } catch {
      this.store(null);
      return null;
    }
  },

  /** Refresh a minute before expiry so a long upload never dies mid-request. */
  async validToken() {
    if (!this.session) return null;
    if (this.session.expires_at - 60 <= Math.floor(Date.now() / 1000)) {
      if (!await this.refresh()) return null;
    }
    return this.session.access_token;
  },

  async signOut() {
    try {
      if (this.session) {
        await this.gotrue("logout", { token: this.session.access_token });
      }
    } catch { /* the local session is cleared regardless */ }
    this.store(null);
    this.profile = null;
    location.hash = "";
    location.reload();
  },
};

// ------------------------------------------------------------- api layer
async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  if (S.authRequired) {
    const token = await Auth.validToken();
    if (!token) { renderAuth(); throw new Error("Your session has expired. Please sign in again."); }
    headers.set("Authorization", `Bearer ${token}`);
  }
  const res = await fetch(API + path, { ...options, headers });

  if (res.status === 401 && S.authRequired) {
    // The token was rejected -- treat it as signed out rather than showing a
    // confusing error over a half-working screen.
    Auth.store(null);
    renderAuth();
    throw new Error("Your session has expired. Please sign in again.");
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res;
}

/** Renders over the whole page: nothing behind a login should be visible. */
function renderAuth(mode = "signin", message = "") {
  document.querySelector(".app").hidden = true;
  let host = document.getElementById("authWrap");
  if (!host) {
    host = document.createElement("div");
    host.id = "authWrap";
    host.className = "auth-wrap";
    document.body.appendChild(host);
  }
  host.hidden = false;

  const invite = mode === "invite";
  host.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand"><span class="glyph">◧</span><span>ZacoAgents</span></div>
      <h1>${invite ? "Choose a password" : "Sign in"}</h1>
      <p class="sub">${invite
        ? "Set a password for your account to finish setting it up."
        : "This is a private system. Accounts are created by invitation."}</p>

      ${message ? `<div class="auth-msg ${invite ? "info" : "bad"}">${esc(message)}</div>` : ""}

      <form class="auth-form" id="authForm" autocomplete="on">
        ${invite ? "" : `
          <div>
            <label for="authEmail">Email</label>
            <input id="authEmail" type="email" autocomplete="username" required>
          </div>`}
        <div>
          <label for="authPassword">${invite ? "New password" : "Password"}</label>
          <input id="authPassword" type="password"
                 autocomplete="${invite ? "new-password" : "current-password"}"
                 ${invite ? 'minlength="8"' : ""} required>
        </div>
        <button class="btn primary" type="submit" id="authSubmit">
          ${invite ? "Set password and continue" : "Sign in"}
        </button>
      </form>

      <p class="auth-foot">${invite
        ? "Use at least 8 characters."
        : "No account? Ask an administrator to invite you — this system does not accept public sign-ups."}</p>
    </div>`;

  document.getElementById("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("authSubmit");
    const password = document.getElementById("authPassword").value;
    btn.disabled = true;
    btn.textContent = invite ? "Saving…" : "Signing in…";
    try {
      if (invite) {
        await Auth.setPassword(password);
        history.replaceState(null, "", location.pathname);   // strip the token
      } else {
        await Auth.signIn(document.getElementById("authEmail").value.trim(), password);
      }
      await startApp();
    } catch (err) {
      renderAuth(mode, err.message || String(err));
    }
  });
}

/** Invite and recovery links land with tokens in the URL fragment. */
function consumeAuthFragment() {
  if (!location.hash.includes("access_token")) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  const access_token = p.get("access_token");
  if (!access_token) return null;
  Auth.store({
    access_token,
    refresh_token: p.get("refresh_token"),
    expires_at: Math.floor(Date.now() / 1000) + Number(p.get("expires_in") || 3600),
    user: null,
  });
  return p.get("type") || "invite";
}

// ---------------------------------------------------------- procurement
// A ranked buy list, pushed rather than asked for. The levels come from
// /api/procurement, which computes them from the saved sales history -- the
// same history in always gives the same levels out, and every score can be
// traced to the figures shown beside it.

const LEVELS = {
  critical: { label: "Critical", note: "take these on first" },
  high:     { label: "High",     note: "worth taking on" },
  low:      { label: "Low",      note: "don’t prioritise" },
};

/** Level per product label, for rendering a signal wherever a product appears.
 *  Keys are the same labels the analytics use (the raw product name, else the
 *  short code), so Insights, the review table and the buy list all agree. */
function buyIndex() {
  const recs = S.buys.data?.recommendations;
  if (!recs) return null;
  const ix = {};
  for (const r of recs) ix[String(r.product).trim().toUpperCase()] = r;
  return ix;
}

/** A product's buy signal as a small chip. Empty string when there is no
 *  history for it, which is not the same as a Low rating and must not look
 *  like one. */
function buyChip(label) {
  const ix = buyIndex();
  if (!ix || !label) return "";
  const r = ix[String(label).trim().toUpperCase()];
  if (!r) return "";
  const why = (r.reasons || [])[0] || "";
  return `<span class="sig ${r.level}" title="${esc(LEVELS[r.level].label)} — ${esc(why)}">${esc(LEVELS[r.level].label)}</span>`;
}

// ---------------------------------------------------------- agent watch
// How the agent has treated the money. Deliberately NOT a page of its own: the
// question only means anything next to the figure that raised it, so the flags
// render inline on Insights, on the payment panel and on the review rows.

/** The agent-watch strip: what the agent kept, and what cannot be checked.
 *
 *  Shown even when nothing is flagged, because "the deduction has been normal on
 *  every sale" is the answer to the question and worth saying plainly. The note
 *  about the price is always there: a panel that only reports what it CAN check
 *  reads as a clean bill of health on the one thing it is blind to. */
function watchStrip(w) {
  if (!w || !w.rate_known_from) return "";
  const rate = w.going_rate == null ? null : (w.going_rate * 100).toFixed(1) + "%";
  const flagged = (w.rate_concerns || []).length;
  const severe = (w.rate_concerns || []).filter(c => c.severity === "severe").length;
  const head = flagged
    ? `<div><span class="wl">Worth asking about</span><b>${flagged} sale${flagged === 1 ? "" : "s"}</b>`
      + (severe ? ` <span class="wsig severe">${severe} serious</span>` : "") + `</div>`
    : `<div><span class="wl">The agent's cut</span><b>normal on all ${fmtInt(w.rate_known_from)} paid sales</b></div>`;
  const list = (w.rate_concerns || []).slice(0, 5).map(c => `
    <li><span class="wsig ${c.severity}">${c.severity === "severe" ? "Check" : "High cut"}</span>
      <span><b>${c.stm_no ?? "—"}</b> ${esc(c.product || "")}
      <span class="wq">kept R ${fmt(c.kept)} of R ${fmt(c.gross)} — ${(c.rate * 100).toFixed(0)}%
      against your usual ${(c.baseline * 100).toFixed(0)}%</span></span></li>`).join("");
  return `<div class="watch-strip">
    ${head}
    ${rate ? `<div><span class="wl">Usual deduction</span><b>${rate}</b></div>` : ""}
    ${(w.totals && w.totals.cartons_left)
      ? `<div><span class="wl">Sent but never sold</span><b>${fmtInt(w.totals.cartons_left)} cartons</b>`
        + `<span class="wq"> of ${fmtInt(w.totals.cartons_sent)} sent`
        + `${w.totals.share_unsold != null ? `, ${Math.round(w.totals.share_unsold * 100)}%` : ""}</span></div>`
      : ""}
    ${list ? `<ul class="watch-list">${list}</ul>` : ""}
    <div class="wnote">${esc(w.price_unverifiable)}</div>
  </div>`;
}

/** Fetch the analytics payload quietly so watch flags work off the Insights page.
 *  Mirrors ensureBuySignals: never flips `loading`, so it cannot blank a screen
 *  the operator is reading, and never retries after one failure. */
async function ensureWatchSignals() {
  const I = S.insights;
  if (I.watchTried || I.data || I.loading || !S.live) return;
  I.watchTried = true;
  try {
    I.data = await (await api("/api/analytics")).json();
    render();
  } catch { /* the flags are an enhancement; never block a page on them */ }
}

/** The integrity block from the last analytics load, keyed for lookup. */
function watchIndex() {
  const w = S.insights && S.insights.data && S.insights.data.integrity;
  if (!w) return null;
  if (!w._ix) {
    const ix = { stm: {}, product: {} };
    for (const c of w.rate_concerns || []) {
      if (c.stm_no != null) ix.stm[String(c.stm_no)] = c;
    }
    // Keyed on the PRODUCT's own share of everything sent, not on a single bad
    // consignment. Indexing unsold_concerns here meant the last consignment for a
    // product won, so oranges showed "85% not sold" when the product's real
    // figure was 7%. The worst consignment is kept alongside, for the tooltip.
    for (const p of Object.values(w.by_product || {})) {
      ix.product[String(p.product).trim().toUpperCase()] = p;
    }
    for (const u of w.unsold || []) {
      const k = String(u.product || "").trim().toUpperCase();
      if (k && ix.product[k] && !ix.product[k].worst) ix.product[k].worst = u;
    }
    w._ix = ix;
  }
  return w._ix;
}

/** A flag for one statement, to sit beside it anywhere it appears. */
function watchChip(stm) {
  const ix = watchIndex();
  const c = ix && stm != null ? ix.stm[String(stm)] : null;
  if (!c) return "";
  const label = c.severity === "severe" ? "Check" : "High cut";
  return `<span class="wsig ${c.severity}" title="${esc(c.why)} Gross R ${fmt(c.gross)}, `
       + `Nett R ${fmt(c.nett)}, so R ${fmt(c.kept)} was kept.">${label}</span>`;
}

/** A flag for a product a notable share of which never sold.
 *
 *  The percentage is the product's own: cartons left over cartons sent, across
 *  every consignment of it, each delivery counted once. */
function unsoldChip(label) {
  const ix = watchIndex();
  const p = ix && label ? ix.product[String(label).trim().toUpperCase()] : null;
  if (!p) return "";
  const worst = p.worst
    ? ` Worst single consignment: ${fmtInt(p.worst.cartons_left)} of `
      + `${fmtInt(p.worst.cartons_sent)} cartons left.`
    : "";
  return `<span class="wsig watch" title="${Math.round(p.share_unsold * 100)}% of everything `
       + `sent of this product never sold, across ${fmtInt(p.consignments)} `
       + `consignment${p.consignments === 1 ? "" : "s"}.${worst} On consignment that loss is the `
       + `supplier's, but the agent decides what moves off the floor.">`
       + `${Math.round(p.share_unsold * 100)}% unsold</span>`;
}

/** Fetch the buy payload quietly so signals work outside the buy list.
 *  Never flips `loading`, so it cannot blank a screen the user is reading. */
async function ensureBuySignals() {
  const B = S.buys;
  if (B.tried || B.data || B.loading || !S.live) return;
  B.tried = true;
  try {
    B.data = await (await api("/api/procurement")).json();
    // A background fetch that succeeds must clear an earlier failure, or the
    // buy list keeps showing "nothing to advise on" while holding real data.
    B.error = null;
    syncBuyBadge();
    render();
  } catch { /* signals are an enhancement; never block the page on them */ }
}

/** The rail badge counts what needs backing first, so the buy list advertises
 *  itself from every module instead of waiting to be visited. */
function syncBuyBadge() {
  const el = document.getElementById("buyBadge");
  if (!el) return;
  const recs = S.buys.data?.recommendations || [];
  const n = recs.filter(r => r.level === "critical").length;
  el.hidden = !n;
  el.textContent = n ? String(n) : "";
  el.title = n ? `${n} line${n === 1 ? "" : "s"} to back first` : "";
}

async function loadBuys() {
  const B = S.buys;
  B.loading = true; B.error = null; render();
  try {
    B.data = S.live ? await (await api("/api/procurement")).json() : null;
    B.tried = true;
    syncBuyBadge();
    if (!S.live) B.error = "This reads your saved sales history, so it needs the live app.";
  } catch (e) {
    B.error = e.message || String(e);
  } finally { B.loading = false; render(); }
}

// --------------------------------------------------------- settlement
// Zaco buys nothing, so there is no budget. What is recorded per consignment
// is the commission percentage agreed with the supplier, and whether they have
// been paid their share yet.

async function loadSettlement() {
  const B = S.buys;
  if (!S.live) { B.settle = { lines: [], by_supplier: [], awaiting_terms: [] }; render(); return; }
  B.settleLoading = true; render();
  try { B.settle = await (await api("/api/consignments")).json(); }
  catch (e) { B.settle = { lines: [], by_supplier: [], awaiting_terms: [], error: e.message }; }
  finally { B.settleLoading = false; render(); }
}

async function loadSuppliers() {
  if (!S.live) { S.buys.suppliers = []; return; }
  try { S.buys.suppliers = (await (await api("/api/suppliers")).json()).suppliers || []; }
  catch { S.buys.suppliers = []; }
}

function setBuyTab(t) {
  S.buys.tab = t;
  if (t === "settle" && S.buys.settle === null) { loadSuppliers().then(loadSettlement); }
  else render();
}

function setDealDraft(key, field, v) {
  const d = S.buys.draft[key] || (S.buys.draft[key] = {});
  d[field] = v;
  // Deliberately no re-render: this fires on every keystroke and would fight
  // the caret.
}

async function saveDeal(ref, product) {
  const key = ref + "|" + product;
  const draft = S.buys.draft[key] || {};
  const pct = parseFloat(draft.pct);
  if (!(pct >= 0 && pct <= 100)) { toast("Enter your commission as a percentage, 0 to 100", true); return; }
  try {
    const body = new URLSearchParams({ supplier_ref: ref, product, commission_pct: pct });
    if (draft.supplier_id) body.set("supplier_id", draft.supplier_id);
    await api("/api/consignments", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
    delete S.buys.draft[key];
    toast("Saved " + pct + "% commission");
    // Terms change both what is owed and how the line ranks.
    S.buys.settle = null; S.buys.data = null; S.buys.tried = false;
    await loadSettlement(); loadBuys();
  } catch (e) { toast(e.message || String(e), true); }
}

async function markPaid(ref, product, amount) {
  if (!confirm("Record that the supplier has been paid R " + fmt(amount) + " for this consignment?")) return;
  try {
    const body = new URLSearchParams({ supplier_ref: ref, product, settled_amount: amount });
    await api("/api/consignments/settle", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
    toast("Marked as paid");
    S.buys.settle = null;
    await loadSettlement();
  } catch (e) { toast(e.message || String(e), true); }
}

async function addSupplier() {
  const name = (S.buys.newSupplier || "").trim();
  if (!name) { toast("Give the supplier a name", true); return; }
  try {
    await api("/api/suppliers", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ name }).toString() });
    S.buys.newSupplier = "";
    toast("Added " + name);
    await loadSuppliers(); render();
  } catch (e) { toast(e.message || String(e), true); }
}

function buyCard(r) {
  // Nothing is paid to acquire stock, so there is no spend to show. Where the
  // terms are on record this is what the line actually EARNED; otherwise it is
  // the share of effort worth putting behind it.
  const spend = r.earning
    ? `<div class="buy-spend"><b>R ${fmt(r.earning.per_carton)}</b><span>your commission a carton</span></div>`
    : r.share
      ? `<div class="buy-spend"><b>${(r.share * 100).toFixed(1)}%</b><span>of your effort</span></div>`
      : `<div class="buy-spend muted"><b>—</b><span>don’t prioritise</span></div>`;
  // On consignment the same carton earns differently depending on who sells it,
  // so where to send it is part of the recommendation, not a footnote.
  // Shown even with a single destination: "this goes to Subtropico" is still an
  // instruction. `compared` guards against implying a choice was made where
  // there was only ever one place for it to go.
  const dst = r.destination;
  const send = dst
    ? `<div class="buy-send"><span class="sl">${dst.compared ? "Best via" : "Goes to"}</span>
         <b>${esc(dst.agent || dst.market)}</b>
         <span class="sp">${dst.agent && dst.market ? `at ${esc(dst.market)} · ` : ""}R ${fmt(dst.avg_price)}/crt realised${dst.compared ? ` · best of ${dst.options}` : ""}</span>
       </div>`
    : "";
  return `<div class="card buy-card ${r.level}">
    <div class="buy-main">
      <div class="buy-name">${esc(r.product)}${r.thin_evidence ? `<span class="buy-thin">thin evidence</span>` : ""}</div>
      ${send}
      <ul class="buy-why">${(r.reasons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="buy-tags">
        ${dst && !dst.compared ? "" : `<span class="buy-tag">R ${fmt(r.avg_price)}/carton realised</span>`}
        <span class="buy-tag">${r.sell_through != null ? Math.round(r.sell_through * 100) + "% sold" : "sell-through unknown"}</span>
        <span class="buy-tag">${fmtInt(r.cartons)} cartons over ${r.consignments} consignment${r.consignments === 1 ? "" : "s"}</span>
      </div>
    </div>
    ${spend}
  </div>`;
}

// ------------------------------------------------------- reconciliation
// Drop a Payment Details report; it is matched against the accumulated Daily
// Sales history (by Supplier Ref + Product across its date range) to reveal the
// Nett and what is still outstanding. See /api/reconcile.

const RECON_STATUS = {
  matched:     { label: "Matched",      cls: "ok"  },
  outstanding: { label: "Outstanding",  cls: "warn" },
  unpaid:      { label: "Unpaid",       cls: "mut" },
  no_sales:    { label: "No sales yet", cls: "mut" },
  over:        { label: "Over-sold",    cls: "bad" },
};
const RECON_ORDER = ["matched", "outstanding", "over", "unpaid", "no_sales"];

function browsePayments() { document.getElementById("paymentInput").click(); }

async function onPaymentFiles(files) {
  const R = S.recon;
  if (!S.live) { R.error = "Reconciliation needs the live app and saved sales history — it can’t run on demo data."; render(); return; }
  R.loading = true; R.error = null; R.applied = false; render();
  try {
    const fd = new FormData();
    files.forEach(f => fd.append("files", f));
    R.data = await (await api("/api/reconcile", { method: "POST", body: fd })).json();
  } catch (e) {
    R.error = e.message || String(e);
  } finally {
    R.loading = false; render();
  }
}

/** Write the reconciled Netts into the open workbook by STM No (consignment).
 *  Sends the file to the backend, which updates each matching row's Nett in
 *  place -- so rows saved in an earlier round get their Nett too -- then saves
 *  the updated file back. */
async function applyReconcileNetts() {
  const netts = (S.recon.data && S.recon.data.netts) || {};
  if (!Object.keys(netts).length) { toast("No reconciled Netts to apply", true); return; }
  if (!S.live) { toast("Applying Netts needs the live app", true); return; }
  if (!S.wb || (!S.wbFile && !S.wbHandle)) {
    toast("Open the workbook in Account Sales first, then apply", true);
    return;
  }
  // Same reason as in saveWorkbook: ask for file access before the round trip,
  // not after it, because the click is spent by then.
  await ensureWritePermission();
  try {
    // Re-read from disk if we have a live handle, so we update the current file.
    let file = S.wbFile;
    if (S.wbHandle && S.wbHandle.getFile) { try { file = await S.wbHandle.getFile(); } catch {} }
    if (!file) { toast("Couldn’t read the workbook — reopen it in Account Sales", true); return; }

    const fd = new FormData();
    fd.append("netts", JSON.stringify(netts));
    fd.append("file", file, S.wb.name);
    const res = await api("/api/workbook/netts", { method: "POST", body: fd });
    const written = res.headers.get("X-Netts-Written") || "0";
    const blob = await res.blob();

    // Reflect in memory and write the updated file back.
    for (const r of S.committed) { const v = netts[String(r.stm_no)]; if (v != null) r.nett_total = v; }
    S.wbFile = blob;
    await persistWorkbook(blob);
    S.recon.applied = true;
    toast(`Wrote ${written} Nett${written === "1" ? "" : "s"} into ${S.wb.name}`);
  } catch (e) {
    toast(e.message || String(e), true);
  }
  render();
}

/** The Payment matching panel that sits beside the workbook on the hub. */
function reconcilePanel() {
  const R = S.recon;
  return `<aside class="card pm-card">
    <div class="pm-head">
      <div><h2>Payment matching</h2>
        <p class="pm-sub">Match a <b>Payment Details</b> report against your saved daily sales to fill the Nett.</p></div>
      ${R.data ? `<button class="btn ghost sm" onclick="browsePayments()">Load another</button>` : ""}
    </div>
    ${reconcileBody(R)}
  </aside>`;
}

function reconcileBody(R) {
  if (R.loading) return `<div class="busy"><span class="spin"></span> Reconciling…</div>`;
  if (R.error) return `<div class="banner bad"><span class="bi">!</span><span>${esc(R.error)}</span></div>
    <button class="btn ghost sm" onclick="browsePayments()">Choose a PDF</button>`;
  if (!R.data) return `<div class="drop pm-drop" tabindex="0" role="button" onclick="browsePayments()">
      <div class="big">⇄</div><div class="t">Drop a Payment Details report</div>
      <div class="s">PDF or CSV</div></div>
    <p class="pm-note">Daily sales must be saved first — they accumulate in the history. Then each Supplier Ref + Product is matched by summing daily Sales Totals against the payment’s Gross.</p>`;

  const d = R.data;
  const rows = [...(d.reconciliation || [])].sort(
    (a, b) => RECON_ORDER.indexOf(a.status) - RECON_ORDER.indexOf(b.status)
      || (b.payment_nett || 0) - (a.payment_nett || 0));
  const c = s => rows.filter(r => r.status === s).length;
  const nettMatched = rows.filter(r => r.status === "matched").reduce((t, r) => t + (r.payment_nett || 0), 0);
  const nettCount = Object.keys(d.netts || {}).length;
  const range = d.date_range || {};

  return `
    ${(d.warnings || []).map(w => `<div class="banner bad"><span class="bi">!</span><span>${esc(w)}</span></div>`).join("")}
    <div class="pm-meta">${d.payment_count || 0} payment line${d.payment_count === 1 ? "" : "s"}${range.from ? ` · ${niceDate(range.from)} – ${niceDate(range.to)}` : ""} · ${d.daily_rows || 0} saved daily row${d.daily_rows === 1 ? "" : "s"}</div>
    <div class="pm-kpis">
      <div class="pm-k ok"><b>${c("matched")}</b><span>Matched</span></div>
      <div class="pm-k warn"><b>${c("outstanding")}</b><span>Outstanding</span></div>
      <div class="pm-k"><b>${c("unpaid")}</b><span>Unpaid</span></div>
      <div class="pm-k"><b>R ${fmt(nettMatched)}</b><span>Nett matched</span></div>
    </div>
    ${deductionNote(d.deductions)}
    ${nettCount ? `<button class="btn primary sm full" onclick="applyReconcileNetts()">${S.recon.applied ? "✓ " : ""}Fill ${nettCount} Nett${nettCount === 1 ? "" : "s"} into ${esc(S.wb.name)}</button>` : ""}
    <div class="pm-list">
      ${rows.map(r => {
        const st = RECON_STATUS[r.status] || { label: r.status, cls: "mut" };
        return `<div class="pm-row">
          <span class="pm-p" title="DN ${r.dn} · ${esc(r.product)}">${esc(r.product)}</span>
          <span class="pm-n num">${r.status === "matched" ? "R " + fmt(r.payment_nett) : "R " + fmt(r.daily_total) + "/" + fmt(r.payment_gross)}</span>
          <span class="rstat ${st.cls}">${st.label}</span>
        </div>`;
      }).join("")}
    </div>`;
}

/** What this payment file's account sales kept, read off the file itself.
 *
 *  Lives here rather than on a page of its own because this is the moment the
 *  operator is looking at the payment: the deduction is the one thing these
 *  reports can prove, and it needs no sales side, so it works even for the rows
 *  that did not reconcile. */
function deductionNote(dd) {
  if (!dd || !dd.of) return "";
  const base = dd.going_rate == null ? null : (dd.going_rate * 100).toFixed(1) + "%";
  const list = (dd.concerns || []).slice(0, 6).map(c => `
    <div class="pm-row">
      <span class="pm-p" title="DN ${c.dn ?? "—"} · ${esc(c.accsale || "")} · ${niceDate(c.date) || ""}">${c.stm_no ?? esc(c.accsale || "—")}</span>
      <span class="pm-n num">R ${fmt(c.gross - c.nett)} of R ${fmt(c.gross)}</span>
      <span class="wsig ${c.severity}" title="${(c.rate * 100).toFixed(0)}% kept${base ? `, against the ${base} this file's median` : ""}">${(c.rate * 100).toFixed(0)}%</span>
    </div>`).join("");
  if (!list) {
    return `<div class="pm-meta">Deductions look normal on all ${fmtInt(dd.of)} account sales`
         + `${base ? ` (median ${base})` : ""}.</div>`;
  }
  return `<div class="pm-meta">${(dd.concerns || []).length} of ${fmtInt(dd.of)} account sales `
       + `deducted more than usual${base ? ` (median ${base})` : ""} — worth asking about:</div>
    <div class="pm-list">${list}</div>`;
}

const fmtInt = n => (typeof n === "number" ? n : 0).toLocaleString("en-ZA", { maximumFractionDigits: 0 });

async function loadInsights() {
  const I = S.insights;
  I.loading = true; I.error = null; render();
  try {
    const qs = new URLSearchParams();
    if (I.month) qs.set("month", I.month);
    if (I.week) qs.set("week", I.week);
    const q = qs.toString();
    I.data = S.live
      ? await (await api(`/api/analytics${q ? "?" + q : ""}`)).json()
      : demoAnalytics(I.month, I.week);
  } catch (e) {
    I.error = e.message || String(e);
  } finally {
    I.loading = false; render();
  }
}

function setInsightMonth(m) {
  const val = m || null;
  if (S.insights.month === val) return;
  S.insights.month = val;
  S.insights.week = null;   // weeks are scoped to the month, so reset
  S.insights.data = null;
  S.insights.confirmDelete = false;

function setInsightWeek(w) {
  const val = w || null;

function askDeleteHistory() { S.insights.confirmDelete = true; render(); }
function cancelDeleteHistory() { S.insights.confirmDelete = false; render(); }
async function confirmDeleteHistory() {
  const I = S.insights;
  if (!S.live) { toast("Deleting history needs the live app", true); return; }
  const body = new URLSearchParams();
  if (I.month) body.set("month", I.month);
  if (I.week) body.set("week", I.week);
  try {
    const res = await (await api("/api/history/delete", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
    })).json();
    I.confirmDelete = false;
    if (res.deleted === 0) {
      // The request succeeded but row-level security removed nothing -- the
      // rows aren't owned by this account (or the delete policy isn't in place).
      toast("Nothing was deleted — your account doesn’t have permission to remove these rows. See the admin note.", true);
    } else {
      toast(`Deleted ${res.deleted} statement${res.deleted === 1 ? "" : "s"} for ${scopeLabel(I)}`);
      I.data = null;      // period is now empty; refetch
      loadInsights();
    }
  } catch (e) {
    toast(e.message || String(e), true);
  }
}

function dateRange(k) {
  if (!k.first_date) return "No dated statements";
  const a = k.first_date, b = k.last_date;
  return a === b ? niceDate(a) : `${niceDate(a)} – ${niceDate(b)}`;
}
function niceDate(iso) {
  const [y, m, dd] = String(iso).split("-").map(Number);
  return `${dd} ${MONTHS[(m || 1) - 1]} ${y}`;
}

/** The Month + Week pickers. Weeks narrow to the chosen month; with no month
 *  chosen the week list spans everything (its label carries the dates). */
function insightControls(avail, I) {
  const months = avail.months || [];
  const monthOpts = `<option value="">All time</option>` + months
    .map(m => `<option value="${m}"${I.month === m ? " selected" : ""}>${esc(monthLabel(m))}</option>`).join("");
  const weekList = I.month ? (avail.weeks_by_month?.[I.month] || []) : (avail.weeks || []);
  const weekOpts = `<option value="">${I.month ? "Whole month" : "All weeks"}</option>` + weekList
    .map(w => `<option value="${w}"${I.week === w ? " selected" : ""}>${esc(weekLabel(w))}</option>`).join("");
  return `<div class="ins-controls">
    <label class="ctl"><span>Month</span>
      <select onchange="setInsightMonth(this.value)">${monthOpts}</select></label>
    <label class="ctl"><span>Week</span>
      <select${weekList.length ? "" : " disabled"} onchange="setInsightWeek(this.value)">${weekOpts}</select></label>
  </div>`;
}

function scopeLabel(I) {
  if (I.week) return weekLabel(I.week);
  if (I.month) return monthLabel(I.month);
  return "All time";
}
function monthLabel(m) {
  const [y, mo] = String(m).split("-").map(Number);
  return new Date(y, (mo || 1) - 1, 1).toLocaleString("en-ZA", { month: "long", year: "numeric" });
}
/** ISO week ("2026-W31") -> "Week 31 · 27 Jul – 2 Aug". */
function weekLabel(wk) {
  const [y, wp] = String(wk).split("-W");
  const w = Number(wp);
  const mon = isoWeekMonday(Number(y), w);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  const d = dt => `${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()]}`;
  return `Week ${w} · ${d(mon)} – ${d(sun)}`;
}
function isoWeekMonday(y, w) {
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const dow = jan4.getUTCDay() || 7;
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - dow + 1 + (w - 1) * 7);
  return monday;
}

function kpiCard(label, value, note, noteHtml) {
  const n = noteHtml === undefined ? esc(note) : noteHtml;
  return `<div class="kpi"><div class="kv">${esc(value)}</div><div class="kl">${esc(label)}</div><div class="kn">${n}</div></div>`;
}

/** Horizontal bars. `metric` selects value/cartons; value bars show R, else units. */
function barList(items, metric, opts) {
  if (!items || !items.length) return `<p class="ins-empty">Nothing to show yet.</p>`;
  const max = Math.max(...items.map(i => i[metric]), 0) || 1;
  const abcClass = { A: "a", B: "b", C: "c" };
  return `<ul class="bars">${items.map(i => {
    const pct = Math.max(2, Math.round((i[metric] / max) * 100));
    const shown = metric === "value" ? "R " + fmt(i.value) : fmtInt(i.cartons);
    const tag = opts.abc && i.abc ? `<span class="abc ${abcClass[i.abc] || ""}">${i.abc}</span>` : "";
    // A best seller and a good buy are not the same claim: turnover says what
    // moved, the signal says whether backing it again is worth the money. Shown
    // together so the difference is visible rather than assumed.
    const sig = opts.signals ? buyChip(i.label) : "";
    // A top seller most of which never sold is the shape worth noticing, so the
    // flag sits on the same line as the turnover that hides it.
    const unsold = opts.signals ? unsoldChip(i.label) : "";
    return `<li class="bar">
      <div class="bl" title="${esc(i.label)}">${tag}<span class="bt">${esc(i.label)}</span>${sig}${unsold}</div>
      <div class="btrack"><span class="bfill" style="width:${pct}%"></span></div>
      <div class="bv">${esc(shown)}</div>
    </li>`;
  }).join("")}</ul>`;
}

/** Compact SVG area+line chart of the trend's value series. */
function trendChart(points) {
  if (!points || !points.length) return `<p class="ins-empty">Not enough dated statements to chart a trend.</p>`;
  if (points.length === 1) {
    const p = points[0];
    return `<p class="ins-empty">One period so far — <b>${esc(shortPeriod(p.period))}</b>: R ${fmt(p.value)}.</p>`;
  }
  const W = 520, H = 160, PAD = 28;
  const max = Math.max(...points.map(p => p.value), 0) || 1;
  const n = points.length;
  const x = i => PAD + (i * (W - PAD * 2)) / (n - 1);
  const y = v => H - PAD - (v / max) * (H - PAD * 2);
  const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${PAD},${H - PAD} ${line} ${(W - PAD)},${H - PAD}`;
  const dots = points.map((p, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3"><title>${esc(shortPeriod(p.period))}: R ${fmt(p.value)}</title></circle>`).join("");
  // Label only the first, middle and last period to avoid crowding.
  const idxs = [...new Set([0, Math.floor((n - 1) / 2), n - 1])];
  const labels = idxs.map(i =>
    `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="tx">${esc(shortPeriod(points[i].period))}</text>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="trend" preserveAspectRatio="xMidYMid meet" role="img">
    <polygon points="${area}" class="area"/>
    <polyline points="${line}" class="stroke"/>
    ${dots}
    <text x="${PAD}" y="14" class="tx">R ${fmt(max)}</text>
    ${labels}
  </svg></div>`;
}
function shortPeriod(p) {
  // "2026-07-27" -> "27 Jul" ; "2026-W31" -> "W31" ; "2026-07" -> "Jul"
  if (/^\d{4}-\d{2}-\d{2}$/.test(p)) {
    const [, m, d] = p.split("-").map(Number);
    return `${d} ${MONTHS[m - 1]}`;
  }
  if (/W\d+$/.test(p)) return p.split("-")[1];
  const [, m] = String(p).split("-");
  return m ? MONTHS[Number(m) - 1] : p;
}

/** Demo analytics when the API is offline: mirrors the backend's shape (incl.
 *  month/week filtering and available periods) over the same sample rows, so
 *  the dashboard is explorable without a backend. */
function demoAnalytics(month, week) {
  const all = [
    ...DEMO_EXISTING.map(r => ({ ...r, market: "TSHWANE MARKET", market_agent: "Farmers Trust", group_date: r.date })),
    ...DEMO_BATCHES.flat().map(r => ({ ...r, market: "JOBURG MKT", market_agent: "Subtropico", group_date: r.date_received })),
  ];
  const val = r => num(r.cartons_sold) * num(r.price);
  const car = r => num(r.cartons_sold);
  const ret = r => num(r.cartons_returned);
  const retVal = r => num(r.returns_total);
  // The product by its real name. The short code belongs to the Excel column,
  // not to the analytics -- it is assigned by hand, so grouping on it split one
  // fruit into two lines the moment a row had no code yet. Mirrors
  // `analytics.product_label`.
  const label = r => r.product || r.description || "Unknown";

  // Available periods (from all rows, so the pickers stay populated).
  const months = new Set(), weeks = new Set(), wbm = {};
  for (const r of all) {
    const mk = periodKey(r.group_date, "month"), wk = periodKey(r.group_date, "week");
    if (!mk) continue;
    months.add(mk); weeks.add(wk);
    (wbm[mk] = wbm[mk] || new Set()).add(wk);
  }
  const available = {
    months: [...months].sort(),
    weeks: [...weeks].sort(),
    weeks_by_month: Object.fromEntries(Object.entries(wbm).map(([m, s]) => [m, [...s].sort()])),
  };

  // Scope to the chosen month/week (week wins), then pick trend granularity.
  const rows = all.filter(r => {
    if (!month && !week) return true;
    const mk = periodKey(r.group_date, "month"), wk = periodKey(r.group_date, "week");
    if (week) return wk === week;
    return mk === month;
  });
  const period = week ? "day" : month ? "week" : "month";

  const roll = key => {
    const m = new Map();
    for (const r of rows) {
      const k = key(r) || "Unknown";
      const o = m.get(k) || { label: k, value: 0, cartons: 0, lines: 0 };
      o.value += val(r); o.cartons += car(r); o.lines++; m.set(k, o);
    }
    return [...m.values()].map(o => ({ ...o, value: round2(o.value), cartons: round2(o.cartons) }))
      .sort((a, b) => b.value - a.value);
  };
  const sellers = roll(label);
  const total = sellers.reduce((s, i) => s + i.value, 0) || 1;
  let before = 0;
  for (const i of sellers) {
    i.share = round4(i.value / total);
    before += i.value;
    i.cumulative_share = round4(before / total);
  }
  let cum = 0;
  for (const i of sellers) { i.abc = cum < 0.8 ? "A" : cum < 0.95 ? "B" : "C"; cum = i.cumulative_share; }
  const periods = new Map();
  for (const r of rows) {
    const pk = periodKey(r.group_date, period);
    if (!pk) continue;
    const o = periods.get(pk) || { period: pk, value: 0, cartons: 0 };
    o.value += val(r); o.cartons += car(r); periods.set(pk, o);
  }
  const trend = [...periods.values()].map(o => ({ ...o, value: round2(o.value), cartons: round2(o.cartons) }))
    .sort((a, b) => a.period < b.period ? -1 : 1);
  const dates = rows.map(r => r.group_date).filter(Boolean).sort();
  return {
    kpis: {
      total_value: round2(rows.reduce((s, r) => s + val(r), 0)),
      total_cartons: round2(rows.reduce((s, r) => s + car(r), 0)),
      gross_value: round2(rows.reduce((s, r) => s + val(r) + retVal(r), 0)),
      cartons_sold: round2(rows.reduce((s, r) => s + car(r) + ret(r), 0)),
      cartons_returned: round2(rows.reduce((s, r) => s + ret(r), 0)),
      returns_value: round2(rows.reduce((s, r) => s + retVal(r), 0)),
      return_rate: (() => {
        const sold = rows.reduce((s, r) => s + car(r) + ret(r), 0);
        return sold ? round4(rows.reduce((s, r) => s + ret(r), 0) / sold) : 0;
      })(),
      statement_count: rows.length,
      product_count: new Set(rows.map(label)).size,
      market_count: new Set(rows.map(r => r.market)).size,
      agent_count: new Set(rows.map(r => r.market_agent)).size,
      first_date: dates[0] || null,
      last_date: dates[dates.length - 1] || null,
    },
    best_sellers: sellers,
    by_market: roll(r => r.market),
    by_agent: roll(r => r.market_agent),
    trend, period, available, filter: { month: month || null, week: week || null },
  };
}
const round2 = n => Math.round(n * 100) / 100;
const round4 = n => Math.round(n * 10000) / 10000;
function periodKey(iso, period) {
  if (!iso) return null;
  const [y, m, dd] = String(iso).split("-").map(Number);
  if (period === "day") return `${y}-${String(m).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
  if (period === "month") return `${y}-${String(m).padStart(2, "0")}`;
  const dt = new Date(Date.UTC(y, m - 1, dd));
  const day = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
  return `${dt.getUTCFullYear()}-W${String(wk).padStart(2, "0")}`;
}
async function withBusy(msg, fn) {
  S.busy = true; S.busyMsg = msg; render();
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), true); throw e; }
  finally { S.busy = false; render(); }
}

/** {account sale: DN} from every row the open workbook already holds.
 *
 *  Both the rows read out of the file and any added this session count: a
 *  delivery entered ten minutes ago should answer for its siblings too. Later
 *  rows win, since those are the more recent statement of the same fact. */
function bookDns() {
  const out = {};
  for (const r of [...(S.committed || []), ...(S.pending || [])]) {
    if (r.stm_no != null && r.dn != null) out[String(r.stm_no)] = r.dn;
  }
  return out;
}

async function onPdfFiles(files) {
  if (!S.live) {
    const batch = DEMO_BATCHES[S.demoPtr % DEMO_BATCHES.length].map(r => ({ ...r, flags: (r.flags||[]).map(f=>({...f})) }));
    S.demoPtr++;
    S.pending = S.screen === "review" ? S.pending.concat(batch) : batch;
    if (S.screen !== "review") go("review"); else renderReview();
    return;
  }
  await withBusy(`Reading ${files.length} statement${files.length === 1 ? "" : "s"}…`, async () => {
    const fd = new FormData();
    files.forEach(f => fd.append("files", f));
    // Column A is Zaco's own DN and the market's export does not carry it. The
    // workbook does, and both sides name the same account sale, so send what the
    // open workbook knows and the DN is recovered instead of asked for again.
    const knownDns = bookDns();
    if (Object.keys(knownDns).length) fd.append("known_dns", JSON.stringify(knownDns));
    const data = await (await api("/api/extract", { method: "POST", body: fd })).json();
    const rows = data.rows || [];
    S.pending = S.screen === "review" ? S.pending.concat(rows) : rows;
    S.screen = "review";
    // Fold in any Nett figures from adjustment reports and apply them across
    // everything under review, so the sales PDFs and the Nett report can be
    // dropped together or separately.
    (data.warnings || []).forEach(w => { if (!S.importWarnings.includes(w)) S.importWarnings.push(w); });
    if (data.netts) Object.assign(S.nettMap, data.netts);
    if (data.nett_match) S.nettReports += data.nett_match.reports;
    applyNetts();
  });
}

/** Split one figure across the rows it covers, in the ratio of their gross, so
 *  the shares add back up to it exactly. This is how the operator's own book
 *  splits a statement between the products on it. */
function splitByGross(total, rows) {
  const grosses = rows.map(r => num(r.cartons_sold) * num(r.price));
  const sum = grosses.reduce((a, b) => a + b, 0);
  const r2 = n => Math.round(n * 100) / 100;
  // Nothing sold under it yet, so there is no ratio: an equal share is the only
  // honest option.
  let shares = (rows.length === 1 || !sum)
    ? rows.map(() => r2(total / rows.length))
    : grosses.map(g => r2(total * (g / sum)));
  const residual = r2(total - shares.reduce((a, b) => a + b, 0));
  if (residual) {
    let biggest = 0;
    grosses.forEach((g, i) => { if (Math.abs(g) > Math.abs(grosses[biggest])) biggest = i; });
    shares[biggest] = r2(shares[biggest] + residual);
  }
  return shares;
}

/** Fill Nett onto every pending row whose statement appears in the round's
 *  adjustment reports, clearing the "enter Nett by hand" warning.
 *
 *  The report gives one figure per statement and a statement now covers several
 *  rows, one per product, so it is split between them. Writing the statement's
 *  whole Nett onto each row would multiply the money by the number of products. */
function applyNetts() {
  const map = S.nettMap || {};
  const groups = {};
  for (const r of S.pending) {
    const key = r.stm_no != null ? String(r.stm_no) : null;
    if (key && map[key] != null) (groups[key] ||= []).push(r);
  }
  for (const [key, rows] of Object.entries(groups)) {
    const shares = splitByGross(map[key], rows);
    rows.forEach((r, i) => {
      r.nett_total = shares[i];
      r.flags = (r.flags || []).filter(f => f.field !== "nett_total");
    });
  }
}

/** Live summary of Nett matching over the rows currently under review. */
function nettSummary() {
  if (!S.nettReports) return null;
  const map = S.nettMap || {};
  const pendingStms = new Set(
    S.pending.map(r => (r.stm_no != null ? String(r.stm_no) : null)).filter(Boolean));
  const matched = S.pending.filter(r => r.stm_no != null && map[String(r.stm_no)] != null).length;
  const unused = Object.keys(map).filter(k => !pendingStms.has(k)).length;
  return {
    reports: S.nettReports,
    statements: Object.keys(map).length,
    matched,
    unmatched: S.pending.length - matched,
    unused,
  };
}

/** The uploaded file a row came from, stripped of the "· consignment N" /
 *  "· statement N of M" / "· product N of M" / "(statement N of M)" suffixes the
 *  extractor adds. Anchors on the keyword so it doesn't depend on the exact
 *  separator char.
 *
 *  Stripped in a loop because they stack: one consignment settled under two
 *  account sales is "june.csv · consignment 1 · statement 1 of 2". Peeling one
 *  suffix only would leave every row with a name of its own, so a file of 70
 *  rows would show 70 chips and none of them would remove anything. */
const FILE_SUFFIXES = [
  /\s*[·•∙|-]?\s*consignment\s+\d+\s*$/i,
  /\s*[·•∙|-]?\s*statement\s+\d+\s+of\s+\d+\s*$/i,
  /\s*[·•∙|-]?\s*product\s+\d+\s+of\s+\d+\s*$/i,
  /\s*\(statement\s+\d+\s+of\s+\d+\)\s*$/i,
];

function baseFile(r) {
  let name = String(r.source_file || "Statements");
  for (let peeled = true; peeled; ) {
    peeled = false;
    for (const suffix of FILE_SUFFIXES) {
      const shorter = name.replace(suffix, "");
      if (shorter !== name) { name = shorter; peeled = true; }
    }
  }
  return name.trim();
}

/** Removable chips, one per uploaded PDF in the current round. */
function pdfChips(pool) {
  const groups = {};
  for (const r of pool) { const n = baseFile(r); groups[n] = (groups[n] || 0) + 1; }
  const names = Object.keys(groups);
  if (!names.length) return "";
  return `<div class="pdf-chips">${names.map(n => `
    <span class="pchip" data-name="${esc(n)}">
      <span class="pci">▤</span>
      <span class="pcn" title="${esc(n)}">${esc(n)}</span>
      <span class="pcc">${groups[n]} row${groups[n] === 1 ? "" : "s"}</span>
      <button class="pcx" title="Remove this PDF" onclick="removePdf(this.closest('.pchip').dataset.name)">×</button>
    </span>`).join("")}</div>`;
}

/** Drop every row that came from one PDF -- for when the wrong file was added. */
function removePdf(name) {

  S.pending = S.pending.filter(r => baseFile(r) !== name);
  const removed = before - S.pending.length;
  toast(`Removed ${name} · ${removed} row${removed === 1 ? "" : "s"}`);
  applyNetts();
  render();
}
