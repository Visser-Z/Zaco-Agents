// ------------------------------------------------------------ chrome
/** Highlight the active tab. */
function syncModuleNav() {
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.dataset.module === S.module));
}
function setModule(m) {
  if (S.module === m) return;
  S.module = m;
  // Both pages read the saved history; re-fetch on entry so they reflect any
  // statements saved since they were last opened, rather than a stale snapshot.
  // The error has to be cleared with the data: the auto-load guard on each page
  // is `data === null && !loading && error === null`, so a page left holding an
  // error from one bad response would never load again, however many times it
  // was reopened. Insights would sit on "Could not load analytics" while
  // Tracking, which had not failed, kept working -- and the history looked
  // missing from one page and present on the other.
  const view = m === "insights" ? S.insights : m === "tracking" ? S.tracking : null;
  if (view) { view.data = null; view.error = null; view.loading = false; }
  render();
  main.scrollTo(0, 0);
}
function go(screen) { S.screen = screen; render(); main.scrollTo(0, 0); }
function render() {
  syncModuleNav();
  if (S.module === "tracking") return renderTracking();
  if (S.module === "insights") return renderInsights();
  if (S.busy) return renderBusy();
  if (S.screen === "hub") return renderHub();
  if (S.screen === "review") return renderReview();
}

// ------------------------------------------------------------- tracking
// Three questions the owner asks, answered from saved data: what has been paid
// and what is still owed, how much sold each day, and what is not moving.

async function loadTracking() {
  const T = S.tracking;
  T.loading = true; T.error = null; render();
  try {
    const qs = new URLSearchParams();
    if (T.from) qs.set("from", T.from);
    if (T.to) qs.set("to", T.to);
    if (T.month) qs.set("month", T.month);
    if (T.week) qs.set("week", T.week);
    const q = qs.toString();
    T.data = S.live ? await (await api(`/api/tracking${q ? "?" + q : ""}`)).json() : null;
    if (!S.live) T.error = "This reads your saved history, so it needs the live app.";
  } catch (e) {
    T.error = e.message || String(e);
  } finally {
    T.loading = false; render();
  }
}

/** Open one block full width, or close it. Only one is open at a time: two
 *  long lists side by side is the layout this replaced. */
function toggleTrackingBlock(key) {
  S.tracking.open = S.tracking.open === key ? null : key;
  if (S.tracking.open !== "sales") S.tracking.day = null;
  render();
  main.scrollTo(0, 0);
}

/** Close a Tracking line, or put it back. Advisory only: the sale and the
 *  payment behind it are untouched, and a closed line keeps its value on the
 *  closed list so closing can never quietly shrink what is owed. */
async function closeTrackingItem(kind, ref, reopen) {
  const T = S.tracking;
  const body = new FormData();
  body.append("kind", kind);
  body.append("ref", ref);
  try {
    const r = await api(`/api/tracking/${reopen ? "reopen" : "close"}`, { method: "POST", body });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
    await loadTracking();
  } catch (e) {
    T.error = e.message || String(e);
    render();
  }
}

/** Scope the whole tab to a month or a week. Week is the finer scope; changing
 *  the month drops the week with it, because weeks are listed per month. */
function setTrackingMonth(m) {
  const T = S.tracking;
  T.month = m || null;
  T.week = null;
  T.from = ""; T.to = "";       // the day pickers are the finer control; reset
  loadTracking();
}

function setTrackingWeek(w) {
  S.tracking.week = w || null;
  S.tracking.from = ""; S.tracking.to = "";
  loadTracking();
}

function setTrackingChart(metric) {
  S.tracking.chart = metric;
  render();
}

function setTrackingDay(d) {
  S.tracking.day = S.tracking.day === d ? null : d;
  render();
}

function setTrackingRange(which, value) {
  S.tracking[which] = value || "";
  S.tracking.day = null;          // a stale open day may be outside the new range
  S.tracking.open = "sales";      // stay where the operator was working
  loadTracking();
}

function clearTrackingRange() {
  S.tracking.from = S.tracking.to = "";
  S.tracking.day = null;
  S.tracking.open = "sales";
  loadTracking();
}

/** Print just the outstanding list. A class on <body> swaps the page over to a
 *  print-only sheet, so there is no popup to be blocked and no second render
 *  path that could disagree with what is on screen. */
function printOutstanding() {
  document.body.classList.add("printing-outstanding");
  const done = () => {
    document.body.classList.remove("printing-outstanding");
    window.removeEventListener("afterprint", done);
  };
  window.addEventListener("afterprint", done);
  window.print();
  // Safari and some Chrome builds never fire afterprint; clear it regardless.
  setTimeout(done, 1000);
}

/** Days between an ISO date and today, or null. */
function ageInDays(iso) {
  if (!iso) return null;
  const then = new Date(iso + "T00:00:00");
  if (isNaN(then)) return null;
  return Math.round((Date.now() - then) / 86400000);
}

/* --- day-to-day sales, per product -----------------------------------------
 *  A stacked bar per selling day, one band per product, so the question the
 *  owner actually asks -- "what moved, and on which day" -- is answered by
 *  looking rather than by reading down eight tables. Products beyond the top
 *  few are pooled into Other: a legend of thirty commodities tells nobody
 *  anything, and the tail is individually tiny by definition.
 */
const CHART_COLOURS = ["#1F5FA8", "#1E7A4D", "#9A6410", "#B23B34", "#5B4B9E",
                       "#0E7490", "#A34A78", "#4D6B1F"];
const CHART_TOP = 8;

function chartSeries(days, metric) {
  const total = {};
  days.forEach(d => (d.products || []).forEach(p => {
    total[p.product] = (total[p.product] || 0) + (p[metric] || 0);
  }));
  const ranked = Object.keys(total).sort((a, b) => total[b] - total[a]);
  const top = ranked.slice(0, CHART_TOP);
  const named = new Set(top);
  const hasOther = ranked.length > top.length;
  const names = hasOther ? top.concat(["Other"]) : top;
  const rows = days.map(d => {
    const by = {};
    (d.products || []).forEach(p => {
      const key = named.has(p.product) ? p.product : "Other";
      by[key] = (by[key] || 0) + (p[metric] || 0);
    });
    return { date: d.date, by, total: names.reduce((t, n) => t + (by[n] || 0), 0) };
  });
  return { names, rows };
}

/** Stacked bars: x is the selling day, y is cartons or rand. */
function dayChart(days, metric) {
  const chron = days.slice().reverse();            // days arrive newest first
  if (!chron.length) return `<p class="ins-empty">Nothing to chart.</p>`;
  const { names, rows } = chartSeries(chron, metric);
  if (!names.length) return `<p class="ins-empty">No products on these days.</p>`;

  const W = 900, H = 300, L = 62, R = 12, T = 14, B = 44;
  const iw = W - L - R, ih = H - T - B;
  const peak = Math.max(...rows.map(r => r.total), 0) || 1;
  // A round number above the tallest bar, so the gridlines read as figures.
  const step = Math.pow(10, Math.floor(Math.log10(peak))) / 2;
  const top = Math.ceil(peak / step) * step;
  const y = v => T + ih - (v / top) * ih;
  const bw = Math.min(58, (iw / rows.length) * 0.68);
  const money = metric === "value";
  const tick = v => money ? "R " + fmtInt(v) : fmtInt(v);

  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const v = top * f;
    return `<line class="cg" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
            <text class="ct" x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${tick(v)}</text>`;
  }).join("");

  const bars = rows.map((r, i) => {
    const cx = L + (iw / rows.length) * (i + 0.5);
    let acc = 0;
    const seg = names.map((n, j) => {
      const v = r.by[n] || 0;
      if (v <= 0) return "";
      const y0 = y(acc + v), y1 = y(acc);
      acc += v;
      return `<rect x="${cx - bw / 2}" y="${y0}" width="${bw}" height="${Math.max(0.6, y1 - y0)}"
                fill="${CHART_COLOURS[j % CHART_COLOURS.length]}"><title>${esc(niceDate(r.date) || r.date)}
${esc(n)} — ${tick(v)}</title></rect>`;
    }).join("");
    return `${seg}<text class="cx" x="${cx}" y="${H - B + 17}" text-anchor="middle">${esc(shortDay(r.date))}</text>
            <text class="cv" x="${cx}" y="${y(r.total) - 5}" text-anchor="middle">${tick(r.total)}</text>`;
  }).join("");

  const legend = names.map((n, j) => `<span class="clg">
      <i style="background:${CHART_COLOURS[j % CHART_COLOURS.length]}"></i>${esc(shortProduct(n))}</span>`).join("");

  return `<div class="chart-head">
      <div class="seg">
        <button class="${metric === "value" ? "on" : ""}" onclick="event.stopPropagation(); setTrackingChart('value')">Rand</button>
        <button class="${metric === "cartons" ? "on" : ""}" onclick="event.stopPropagation(); setTrackingChart('cartons')">Cartons</button>
      </div>
    </div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="daychart" role="img"
      aria-label="Sales per day by product" preserveAspectRatio="xMidYMid meet">
      ${grid}
      <line class="ca" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
      ${bars}
    </svg></div>
    <div class="clegend">${legend}</div>`;
}

/** "1 Aug" -- the axis has no room for the year, and every bar shares it. */
function shortDay(iso) {
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.getUTCDate() + " " + MONTHS[d.getUTCMonth()];
}

/** A JS string literal safe to drop inside a double-quoted HTML attribute.
 *  JSON.stringify alone quotes with `"`, which closes the attribute early
 *  and silently truncates the handler, so the quotes are escaped too. */
function q(v) { return esc(JSON.stringify(String(v))); }

/** Product names run past fifty characters, and the packaging tail is the
 *  least useful part of one: "CHERRIES OTHER CLASS 1 MEDIUM (STANDARD TRAY
 *  4.5kg)" truncates to "CHERRIES OTHER CLASS 1 MED..." in a narrow column,
 *  hiding the MEDIUM that tells it apart from the LARGE below it. Drop the
 *  bracket, keep the grade. The full name stays on the title attribute. */
function shortProduct(name) {
  return String(name || "").replace(/\s*\([^)]*\)\s*/g, " ").trim();
}

function renderTracking() {
  const T = S.tracking;
  if (T.data === null && !T.loading && T.error === null) loadTracking();

  // Scope the tab to a month or a week. Owed money is scoped by when it was
  // sold, slow stock by when it arrived, so "August" means the same thing in
  // both: what August put on the floor and what August is still owed for.
  const per = (T.data && T.data.periods) || { months: [], weeks: [], weeks_by_month: {} };
  const monthOpts = `<option value="">All time</option>` + (per.months || [])
    .map(m => `<option value="${m}"${T.month === m ? " selected" : ""}>${esc(monthLabel(m))}</option>`).join("");
  const weekList = T.month ? ((per.weeks_by_month || {})[T.month] || []) : (per.weeks || []);
  const weekOpts = `<option value="">${T.month ? "Whole month" : "All weeks"}</option>` + weekList
    .map(w => `<option value="${w}"${T.week === w ? " selected" : ""}>${esc(weekLabel(w))}</option>`).join("");

  const head = `<div class="head ins-head">
      <div><h1>Tracking</h1>${T.month || T.week
        ? `<p class="head-sub">${esc(T.week ? weekLabel(T.week) : monthLabel(T.month))}</p>` : ""}</div>
      <div class="ins-actions">
        <label class="ctl"><span>Month</span>
          <select onchange="setTrackingMonth(this.value)">${monthOpts}</select></label>
        <label class="ctl"><span>Week</span>
          <select onchange="setTrackingWeek(this.value)">${weekOpts}</select></label>
        <button class="btn ghost sm refresh" onclick="loadTracking()">↻ Refresh</button>
      </div>
    </div>`;

  if (T.loading && !T.data) {
    main.innerHTML = `<section class="screen">${head}
      <div class="card"><div class="busy"><span class="spin"></span> Loading…</div></div></section>`;
    return;
  }
  if (!T.data) {
    main.innerHTML = `<section class="screen">${head}
      <div class="card placeholder"><div class="pi">◔</div><h2>Nothing tracked yet</h2>
      <p>${esc(T.error || "Save some sales, then load a Payment Details report.")}</p></div></section>`;
    return;
  }

  const p = T.data.payments || {};
  const days = (T.data.sales_by_day || {}).days || [];
  const slow = T.data.slow_stock || { bands: {}, counts: {}, items: [] };
  const owed = p.outstanding || [];
  const slowItems = slow.items || [];
  const open = T.open;                      // "owed" | "slow" | "sales" | null

  /** One block: five rows at rest, everything once opened. */
  const block = (key, title, count, summary, preview, full, actions) => {
    const isOpen = open === key;
    const label = isOpen ? "Close" : (count > 5 ? "Show all " + fmtInt(count) : "Open");
    return `<section class="trk-block card${isOpen ? " open" : ""}" data-block="${key}">
      <header class="trk-head" onclick="toggleTrackingBlock('${key}')">
        <div class="trk-title"><h2>${title}</h2><span class="trk-sum">${summary}</span></div>
        <div class="trk-tools">${isOpen ? (actions || "") : ""}
          <button class="trk-toggle" aria-expanded="${isOpen}"
            onclick="event.stopPropagation(); toggleTrackingBlock('${key}')">${label}
            <span class="chev">${isOpen ? "▴" : "▾"}</span></button></div>
      </header>
      <div class="trk-body">${isOpen ? full : preview}</div>
    </section>`;
  };

  const emptyBlock = (title, summary, message) => `
    <section class="trk-block card">
      <header class="trk-head"><div class="trk-title"><h2>${title}</h2>
        <span class="trk-sum">${summary}</span></div></header>
      <div class="trk-body"><p class="ins-empty">${message}</p></div></section>`;

  // --- outstanding ---------------------------------------------------------
  const owedRow = r => `<li>
      <span class="trk-p" title="${esc(r.product || r.reference || "")}">${esc(shortProduct(r.product || r.reference) || "—")}</span>
      <span class="trk-d">${r.dn != null ? "DN " + esc(r.dn) : ""}</span>
      <span class="trk-n num">R ${fmt(r.owed)}</span>
      <button class="xbtn" title="Close this one off"
        onclick="event.stopPropagation(); closeTrackingItem('owed', ${q(r.ref)})">×</button></li>`;

  /** Lines already dealt with. Shown, not hidden: the value stays on screen so
   *  closing something can never make the exposure look smaller than it is. */
  const closedList = (rows, kind, what) => !rows.length ? "" : `
    <p class="trk-note">${fmtInt(rows.length)} closed${kind === "owed"
      ? ` · R ${fmt(rows.reduce((t, r) => t + (r.owed || 0), 0))} not counted above` : ""}</p>
    <ul class="trk-list${kind === "slow" ? " trk-sig" : ""}">${rows.map(r => `<li class="done">
      ${kind === "slow" ? `<span class="wsig t-${esc(r.tier)}">${fmtInt(r.days_on_floor)}d</span>` : ""}
      <span class="trk-p" title="${esc(r.product || r.reference || "")}">${esc(shortProduct(r.product || r.reference) || "—")}</span>
      <span class="trk-d">${what(r)}</span>
      <button class="xbtn undo" title="Put this back on the list"
        onclick="event.stopPropagation(); closeTrackingItem('${kind}', ${q(r.ref)}, true)">Reopen</button>
      </li>`).join("")}</ul>`;

  const owedFull = `
    <div class="print-head">Outstanding payments · ${esc(niceDate(new Date().toISOString().slice(0, 10)))}
      · ${fmtInt(owed.length)} to collect · R ${fmt(p.still_to_come)}</div>
    <ol class="trk-cols">${owed.map(owedRow).join("")}</ol>
    ${(p.overpaid || []).length ? `<p class="trk-note">${p.overpaid.length} group${p.overpaid.length === 1 ? "" : "s"} paid for more than sold — R ${fmt(p.overpaid.reduce((a, r) => a + r.overpaid, 0))}.</p>` : ""}
    ${(p.unmatched || []).length ? `<p class="trk-note warn">${p.unmatched.length} payment${p.unmatched.length === 1 ? "" : "s"} with no matching sale.</p>` : ""}
    ${(p.unattributed && p.unattributed.count) ? `<p class="trk-note">R ${fmt(p.unattributed.gross)} paid across ${p.unattributed.count} account sale${p.unattributed.count === 1 ? "" : "s"} with no product breakdown, so it can never match.</p>` : ""}
    ${closedList(p.closed || [], "owed", r => "R " + fmt(r.owed))}`;

  const owedBlock = owed.length
    ? block("owed", "Outstanding", owed.length,
        `R ${fmt(p.still_to_come)} across ${fmtInt(p.batches_outstanding)} batch${p.batches_outstanding === 1 ? "" : "es"}`,
        `<ul class="trk-list">${owed.slice(0, 5).map(owedRow).join("")}</ul>`,
        owedFull,
        `<button class="btn ghost sm" onclick="event.stopPropagation(); printOutstanding()">Print</button>`)
    : emptyBlock("Outstanding", "nothing owed", "Everything sold has been paid for.");

  // --- slow stock ----------------------------------------------------------
  const slowRow = r => `<li>
      <span class="wsig t-${esc(r.tier)}" title="${esc(TIER_WORD[r.tier] || r.tier)}">${fmtInt(r.days_on_floor)}d</span>
      <span class="trk-p" title="${esc(r.product)}">${esc(shortProduct(r.product))}</span>
      <span class="trk-n num">${fmtInt(r.cartons_left)} of ${fmtInt(r.cartons_sent)}</span>
      <button class="xbtn" title="Close this one off"
        onclick="event.stopPropagation(); closeTrackingItem('slow', ${q(r.ref)})">×</button></li>`;

  const slowBlock = slowItems.length
    ? block("slow", "Taking too long to sell", slowItems.length,
        `${fmtInt(slow.flagged)} line${slow.flagged === 1 ? "" : "s"} · flagged past ${fmtInt(slow.bands.watch)} days`,
        `<ul class="trk-list trk-sig">${slowItems.slice(0, 5).map(slowRow).join("")}</ul>`,
        `<ul class="trk-list trk-sig trk-cols-2">${slowItems.map(slowRow).join("")}</ul>
         <p class="trk-note">Watch ${fmtInt(slow.bands.watch)}d · Slow ${fmtInt(slow.bands.slow)}d · Dead ${fmtInt(slow.bands.dead)}d, read from ${esc(slow.bands.from || "")}.</p>
         ${closedList(slow.closed || [], "slow", r => fmtInt(r.cartons_left) + " of " + fmtInt(r.cartons_sent))}`)
    : emptyBlock("Taking too long to sell", "nothing sitting", "Nothing is sitting longer than usual.");

  // --- sales per day -------------------------------------------------------
  const span = T.data.span || {};
  const bounds = `${span.first ? `min="${span.first}"` : ""} ${span.last ? `max="${span.last}"` : ""}`;
  const ranged = !!(T.from || T.to);

  const dayRow = d => `<li>
      <span class="trk-p">${esc(niceDate(d.date) || d.date)}</span>
      <span class="trk-d">${fmtInt(d.cartons)} ctn${d.returned ? " · " + fmtInt(d.returned) + " back" : ""}</span>
      <span class="trk-n num">R ${fmt(d.value)}</span></li>`;

  /* Every day, with exactly what sold under it. The product lines are always
     visible: hiding them behind a click per day was the whole complaint. */
  const dayBlock = d => `<div class="sday">
      <div class="sday-head">
        <span class="sday-date">${esc(niceDate(d.date) || d.date)}</span>
        <span class="sday-tot num">${fmtInt(d.cartons)} ctn${d.returned ? ` · ${fmtInt(d.returned)} back` : ""} · R ${fmt(d.value)}</span>
      </div>
      <table class="sday-items">
        <colgroup><col><col class="c-n"><col class="c-n"><col class="c-n"></colgroup>
        <thead><tr><th>Product</th><th>Cartons</th><th>Per carton</th><th>Value</th></tr></thead>
        <tbody>${d.products.map(x => {
          const off = x.market_avg && x.price < x.market_avg * 0.7;
          return `<tr>
            <td class="sday-p" title="${esc(x.product)}">${esc(shortProduct(x.product))}${x.returned ? `<span class="sday-back">${fmtInt(x.returned)} back</span>` : ""}</td>
            <td class="num">${fmtInt(x.cartons)}</td>
            <td class="num${off ? " under" : ""}">R ${fmt(x.price)}${x.market_avg ? `<span class="sday-mkt">mkt R ${fmt(x.market_avg)}</span>` : ""}</td>
            <td class="num">R ${fmt(x.value)}</td></tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;
  const dayTable = `${dayChart(days, T.chart)}
      <div class="sday-list">${days.map(dayBlock).join("")}</div>`;

  const pickers = `
    <label class="ctl inline"><span>From</span><input type="date" value="${esc(T.from)}" ${bounds}
      onclick="event.stopPropagation()" onchange="setTrackingRange('from', this.value)"></label>
    <label class="ctl inline"><span>To</span><input type="date" value="${esc(T.to)}" ${bounds}
      onclick="event.stopPropagation()" onchange="setTrackingRange('to', this.value)"></label>
    ${ranged ? `<button class="btn ghost sm" onclick="event.stopPropagation(); clearTrackingRange()">Clear</button>` : ""}`;

  const totalCartons = days.reduce((a, d) => a + d.cartons, 0);
  const salesBlock = (days.length || ranged)
    ? block("sales", "Sales per day", days.length,
        `${fmtInt(days.length)} day${days.length === 1 ? "" : "s"} · ${fmtInt(totalCartons)} cartons${ranged ? " · filtered" : ""}`,
        days.length ? `<ul class="trk-list">${days.slice(0, 5).map(dayRow).join("")}</ul>`
                    : `<p class="ins-empty">No sales in that range.</p>`,
        days.length ? dayTable : `<p class="ins-empty">No sales in that range.</p>`,
        pickers)
    : emptyBlock("Sales per day", "nothing recorded", "No sales recorded yet.");

  main.innerHTML = `
    <section class="screen ins">
      ${head}
      <div class="kpis kpis-2">
        ${kpiCard("Paid", "R " + fmt(p.total_paid),
          `${fmtInt(p.batches_paid)} batch${p.batches_paid === 1 ? "" : "es"} settled`)}
        ${kpiCard("Still to come", "R " + fmt(p.still_to_come),
          `${fmtInt(p.batches_outstanding)} outstanding`
          + (p.oldest_outstanding ? ` · oldest ${ageInDays(p.oldest_outstanding)} days` : "")
          + (p.still_to_come_all_time !== undefined
             ? ` · R ${fmt(p.still_to_come_all_time)} all time` : ""))}
      </div>
      <div class="trk-grid${open ? " has-open" : ""}">
        ${owedBlock}${slowBlock}${salesBlock}
      </div>
    </section>`;
}

// ---------------------------------------------------------- agent watch
// How the agent has treated the money. Deliberately NOT a page of its own: the
// question only means anything next to the figure that raised it, so the flags
// render inline on Insights, on the payment panel and on the review rows.

/** The agent-watch strip: what the agent kept, and what cannot be checked.
 *
 *  Shown even when nothing is flagged, because "the deduction has been normal on
 *  every sale" is the answer to the question and worth saying plainly. The note
 *  about the price is always there: a panel that only reports what it CAN check
 *  reads as a clean bill of health on the one thing it is blind to. */
function watchStrip(w) {
  if (!w || !w.rate_known_from) return "";
  const rate = w.going_rate == null ? null : (w.going_rate * 100).toFixed(1) + "%";
  const flagged = (w.rate_concerns || []).length;
  const severe = (w.rate_concerns || []).filter(c => c.severity === "severe").length;
  const head = flagged
    ? `<div><span class="wl">Worth asking about</span><b>${flagged} sale${flagged === 1 ? "" : "s"}</b>`
      + (severe ? ` <span class="wsig severe">${severe} serious</span>` : "") + `</div>`
    : `<div><span class="wl">The agent's cut</span><b>normal on all ${fmtInt(w.rate_known_from)} paid sales</b></div>`;
  const list = (w.rate_concerns || []).slice(0, 5).map(c => `
    <li><span class="wsig ${c.severity}">${c.severity === "severe" ? "Check" : "High cut"}</span>
      <span><b>${c.stm_no ?? "—"}</b> ${esc(c.product || "")}
      <span class="wq">kept R ${fmt(c.kept)} of R ${fmt(c.gross)} — ${(c.rate * 100).toFixed(0)}%
      against your usual ${(c.baseline * 100).toFixed(0)}%</span></span></li>`).join("");
  return `<div class="watch-strip">
    ${head}
    ${rate ? `<div><span class="wl">Usual deduction</span><b>${rate}</b></div>` : ""}
    ${(w.totals && w.totals.cartons_left)
      ? `<div><span class="wl">Sent but never sold</span><b>${fmtInt(w.totals.cartons_left)} cartons</b>`
        + `<span class="wq"> of ${fmtInt(w.totals.cartons_sent)} sent`
        + `${w.totals.share_unsold != null ? `, ${Math.round(w.totals.share_unsold * 100)}%` : ""}</span></div>`
      : ""}
    ${priceBlock(w.price)}
    ${list ? `<ul class="watch-list">${list}</ul>` : ""}
    ${w.price_unverifiable ? `<div class="wnote">${esc(w.price_unverifiable)}</div>` : ""}
  </div>`;
}

/** What the produce fetched against what the market was paying for it.
 *
 *  Blank until the agent fills in the Market Avg column; every export up to
 *  July 2026 left it at zero, and the caveat above covers those periods. */
function priceBlock(p) {
  if (!p || !p.known) return "";
  const share = p.share_of_market == null ? null : Math.round(p.share_of_market * 100);
  const over = p.short_by < 0;
  const worst = (p.concerns || []).slice(0, 5).map(c => `
    <li><span class="wsig ${c.severity}">${Math.round(c.ratio * 100)}%</span>
      <span><b>${fmtInt(c.cartons)} ctn</b> ${esc(c.product || "")}
      <span class="wq">R ${fmt(c.realised)} a carton against the market's R ${fmt(c.market_avg)}
      — R ${fmt(c.short_by)} below it</span></span></li>`).join("");
  return `<div><span class="wl">${over ? "Above the market" : "Against the market"}</span>
      <b>${share == null ? "—" : share + "%"}</b>
      <span class="wq"> of the market average, over ${fmtInt(p.covered)} of ${fmtInt(p.of)} sales`
    + `${p.flagged ? ` · ${p.flagged} line${p.flagged === 1 ? "" : "s"} R ${fmt(p.short_on_flagged)} below` : ""}</span></div>
    ${worst ? `<ul class="watch-list">${worst}</ul>` : ""}`;
}

/** Fetch the analytics payload quietly so watch flags work off the Insights page.
 *  Never flips `loading`, so it cannot blank a screen the operator is reading,
 *  and never retries after one failure. */
async function ensureWatchSignals() {
  const I = S.insights;
  if (I.watchTried || I.data || I.loading || !S.live) return;
  I.watchTried = true;
  try {
    I.data = await (await api("/api/analytics")).json();
    render();
  } catch { /* the flags are an enhancement; never block a page on them */ }
}

/** The integrity block from the last analytics load, keyed for lookup. */
function watchIndex() {
  const w = S.insights && S.insights.data && S.insights.data.integrity;
  if (!w) return null;
  if (!w._ix) {
    const ix = { stm: {}, product: {} };
    for (const c of w.rate_concerns || []) {
      if (c.stm_no != null) ix.stm[String(c.stm_no)] = c;
    }
    // Keyed on the PRODUCT's own share of everything sent, not on a single bad
    // consignment. Indexing unsold_concerns here meant the last consignment for a
    // product won, so oranges showed "85% not sold" when the product's real
    // figure was 7%. The worst consignment is kept alongside, for the tooltip.
    for (const p of Object.values(w.by_product || {})) {
      ix.product[String(p.product).trim().toUpperCase()] = p;
    }
    for (const u of w.unsold || []) {
      const k = String(u.product || "").trim().toUpperCase();
      if (k && ix.product[k] && !ix.product[k].worst) ix.product[k].worst = u;
    }
    w._ix = ix;
  }
  return w._ix;
}

/** A flag for one statement, to sit beside it anywhere it appears. */
function watchChip(stm) {
  const ix = watchIndex();
  const c = ix && stm != null ? ix.stm[String(stm)] : null;
  if (!c) return "";
  const label = c.severity === "severe" ? "Check" : "High cut";
  return `<span class="wsig ${c.severity}" title="${esc(c.why)} Gross R ${fmt(c.gross)}, `
       + `Nett R ${fmt(c.nett)}, so R ${fmt(c.kept)} was kept.">${label}</span>`;
}

/** A flag for a product a notable share of which never sold.
 *
 *  The percentage is the product's own: cartons left over cartons sent, across
 *  every consignment of it, each delivery counted once. */
function unsoldChip(label) {
  const ix = watchIndex();
  const p = ix && label ? ix.product[String(label).trim().toUpperCase()] : null;
  if (!p) return "";
  const worst = p.worst
    ? ` Worst single consignment: ${fmtInt(p.worst.cartons_left)} of `
      + `${fmtInt(p.worst.cartons_sent)} cartons left.`
    : "";
  return `<span class="wsig watch" title="${Math.round(p.share_unsold * 100)}% of everything `
       + `sent of this product never sold, across ${fmtInt(p.consignments)} `
       + `consignment${p.consignments === 1 ? "" : "s"}.${worst} On consignment that loss is the `
       + `supplier's, but the agent decides what moves off the floor.">`
       + `${Math.round(p.share_unsold * 100)}% unsold</span>`;
}

/** Fetch the buy payload quietly so signals work outside the buy list.
 *  Never flips `loading`, so it cannot blank a screen the user is reading. */
function renderBusy() {
  main.innerHTML = `<section class="screen"><div class="card"><div class="busy"><span class="spin"></span> ${esc(S.busyMsg || "Working…")}</div></div></section>`;
}

// ------------------------------------------------------- reconciliation
// Drop a Payment Details report; it is matched against the accumulated Daily
// Sales history (by Supplier Ref + Product across its date range) to reveal the
// Nett and what is still outstanding. See /api/reconcile.

/** What each ageing band means, for the badge tooltip. */
const TIER_WORD = { watch: "Past the Watch line", slow: "Past Slow", dead: "Past Dead" };

const RECON_STATUS = {
  matched:     { label: "Matched",      cls: "ok"  },
  outstanding: { label: "Outstanding",  cls: "warn" },
  unpaid:      { label: "Unpaid",       cls: "mut" },
  no_sales:    { label: "No sales yet", cls: "mut" },
  over:        { label: "Over-sold",    cls: "bad" },
};
const RECON_ORDER = ["matched", "outstanding", "over", "unpaid", "no_sales"];

function browsePayments() { document.getElementById("paymentInput").click(); }

async function onPaymentFiles(files) {
  const R = S.recon;
  if (!S.live) { R.error = "Reconciliation needs the live app and saved sales history — it can’t run on demo data."; render(); return; }
  R.loading = true; R.error = null; R.applied = false; render();
  try {
    const fd = new FormData();
    files.forEach(f => fd.append("files", f));
    R.data = await (await api("/api/reconcile", { method: "POST", body: fd })).json();
  } catch (e) {
    R.error = e.message || String(e);
  } finally {
    R.loading = false; render();
  }
}

/** The Payment matching panel. */
function reconcilePanel() {
  const R = S.recon;
  return `<aside class="card pm-card">
    <div class="pm-head">
      <div><h2>Payment matching</h2></div>
      ${R.data ? `<button class="btn ghost sm" onclick="browsePayments()">Load another</button>` : ""}
    </div>
    ${reconcileBody(R)}
  </aside>`;
}

function reconcileBody(R) {
  if (R.loading) return `<div class="busy"><span class="spin"></span> Reconciling…</div>`;
  if (R.error) return `<div class="banner bad"><span class="bi">!</span><span>${esc(R.error)}</span></div>
    <button class="btn ghost sm" onclick="browsePayments()">Choose a PDF</button>`;
  if (!R.data) return `<div class="drop pm-drop" tabindex="0" role="button" onclick="browsePayments()">
      <div class="big">⇄</div><div class="t">Drop a Payment Details report</div>
      <div class="s">PDF or CSV</div></div>
    <p class="pm-note">Daily sales must be saved first — they accumulate in the history. Then each Supplier Ref + Product is matched by summing daily Sales Totals against the payment’s Gross.</p>`;

  const d = R.data;
  const rows = [...(d.reconciliation || [])].sort(
    (a, b) => RECON_ORDER.indexOf(a.status) - RECON_ORDER.indexOf(b.status)
      || (b.payment_nett || 0) - (a.payment_nett || 0));
  const c = s => rows.filter(r => r.status === s).length;
  const nettMatched = rows.filter(r => r.status === "matched").reduce((t, r) => t + (r.payment_nett || 0), 0);
  const nettCount = Object.keys(d.netts || {}).length;
  const range = d.date_range || {};

  return `
    ${(d.warnings || []).map(w => `<div class="banner bad"><span class="bi">!</span><span>${esc(w)}</span></div>`).join("")}
    <div class="pm-meta">${d.payment_count || 0} payment line${d.payment_count === 1 ? "" : "s"}${range.from ? ` · ${niceDate(range.from)} – ${niceDate(range.to)}` : ""} · ${d.daily_rows || 0} saved daily row${d.daily_rows === 1 ? "" : "s"}</div>
    <div class="pm-kpis">
      <div class="pm-k ok"><b>${c("matched")}</b><span>Matched</span></div>
      <div class="pm-k warn"><b>${c("outstanding")}</b><span>Outstanding</span></div>
      <div class="pm-k"><b>${c("unpaid")}</b><span>Unpaid</span></div>
      <div class="pm-k"><b>R ${fmt(nettMatched)}</b><span>Nett matched</span></div>
    </div>
    ${deductionNote(d.deductions)}
    ${nettCount ? `<p class="pm-note">${nettCount} Nett${nettCount === 1 ? " is" : "s are"} reconciled and shown here.</p>` : ""}
    <div class="pm-list">
      ${rows.map(r => {
        const st = RECON_STATUS[r.status] || { label: r.status, cls: "mut" };
        return `<div class="pm-row">
          <span class="pm-p" title="DN ${r.dn} · ${esc(r.product || r.reference || "")}">${esc(r.product || r.reference || "—")}</span>
          <span class="pm-n num">${r.status === "matched" ? "R " + fmt(r.payment_nett) : "R " + fmt(r.daily_total) + "/" + fmt(r.payment_gross)}</span>
          <span class="rstat ${st.cls}">${st.label}</span>
        </div>`;
      }).join("")}
    </div>`;
}

/** What this payment file's account sales kept, read off the file itself.
 *
 *  Lives here rather than on a page of its own because this is the moment the
 *  operator is looking at the payment: the deduction is the one thing these
 *  reports can prove, and it needs no sales side, so it works even for the rows
 *  that did not reconcile. */
function deductionNote(dd) {
  if (!dd || !dd.of) return "";
  const base = dd.going_rate == null ? null : (dd.going_rate * 100).toFixed(1) + "%";
  const list = (dd.concerns || []).slice(0, 6).map(c => `
    <div class="pm-row">
      <span class="pm-p" title="DN ${c.dn ?? "—"} · ${esc(c.accsale || "")} · ${niceDate(c.date) || ""}">${c.stm_no ?? esc(c.accsale || "—")}</span>
      <span class="pm-n num">R ${fmt(c.gross - c.nett)} of R ${fmt(c.gross)}</span>
      <span class="wsig ${c.severity}" title="${(c.rate * 100).toFixed(0)}% kept${base ? `, against the ${base} this file's median` : ""}">${(c.rate * 100).toFixed(0)}%</span>
    </div>`).join("");
  if (!list) {
    return `<div class="pm-meta">Deductions look normal on all ${fmtInt(dd.of)} account sales`
         + `${base ? ` (median ${base})` : ""}.</div>`;
  }
  return `<div class="pm-meta">${(dd.concerns || []).length} of ${fmtInt(dd.of)} account sales `
       + `deducted more than usual${base ? ` (median ${base})` : ""} — worth asking about:</div>
    <div class="pm-list">${list}</div>`;
}

// ---------------------------------------------------------------- insights
// Sales analytics over the recorded statement history. The numbers come from
// the backend's /api/analytics (which reads the durable `statements` table);
// when the API is unreachable it falls back to a demo payload built from the
// same sample rows the rest of the app uses, so the dashboard is explorable.

const fmtInt = n => (typeof n === "number" ? n : 0).toLocaleString("en-ZA", { maximumFractionDigits: 0 });

async function loadInsights() {
  const I = S.insights;
  I.loading = true; I.error = null; render();
  try {
    const qs = new URLSearchParams();
    if (I.month) qs.set("month", I.month);
    if (I.week) qs.set("week", I.week);
    const q = qs.toString();
    I.data = S.live
      ? await (await api(`/api/analytics${q ? "?" + q : ""}`)).json()
      : demoAnalytics(I.month, I.week);
  } catch (e) {
    I.error = e.message || String(e);
  } finally {
    I.loading = false; render();
  }
}

function setInsightMonth(m) {
  const val = m || null;
  if (S.insights.month === val) return;
  S.insights.month = val;
  S.insights.week = null;   // weeks are scoped to the month, so reset
  S.insights.data = null;
  S.insights.confirmDelete = false;
  loadInsights();
}
function setInsightWeek(w) {
  const val = w || null;
  if (S.insights.week === val) return;
  S.insights.week = val;
  S.insights.data = null;
  S.insights.confirmDelete = false;
  loadInsights();
}

function askDeleteHistory() { S.insights.confirmDelete = true; render(); }
function cancelDeleteHistory() { S.insights.confirmDelete = false; render(); }
async function confirmDeleteHistory() {
  const I = S.insights;
  if (!S.live) { toast("Deleting history needs the live app", true); return; }
  const body = new URLSearchParams();
  if (I.month) body.set("month", I.month);
  if (I.week) body.set("week", I.week);
  try {
    const res = await (await api("/api/history/delete", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
    })).json();
    I.confirmDelete = false;
    if (res.deleted === 0) {
      // The request succeeded but row-level security removed nothing -- the
      // rows aren't owned by this account (or the delete policy isn't in place).
      toast("Nothing was deleted — your account doesn’t have permission to remove these rows. See the admin note.", true);
    } else {
      toast(`Deleted ${res.deleted} statement${res.deleted === 1 ? "" : "s"} for ${scopeLabel(I)}`);
      I.data = null;      // period is now empty; refetch
      loadInsights();
    }
  } catch (e) {
    toast(e.message || String(e), true);
  }
}
function setInsightMetric(m) {
  if (S.insights.metric === m) return;
  S.insights.metric = m;
  render();                 // best-seller ordering is client-side, no refetch
}

            <button class="btn danger sm" onclick="confirmDeleteHistory()">Delete permanently</button>
          </span>`
        : `<button class="btn ghost sm dtrigger" onclick="askDeleteHistory()">🗑 Delete ${esc(scopeLabel(I))} history…</button>`}
      </div>` : ""}

}

function dateRange(k) {

function scopeLabel(I) {

function monthLabel(m) {
  const [y, mo] = String(m).split("-").map(Number);
  return new Date(y, (mo || 1) - 1, 1).toLocaleString("en-ZA", { month: "long", year: "numeric" });
}
/** ISO week ("2026-W31") -> "Week 31 · 27 Jul – 2 Aug". */
function weekLabel(wk) {
  const [y, wp] = String(wk).split("-W");
  const w = Number(wp);
  const mon = isoWeekMonday(Number(y), w);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  const d = dt => `${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()]}`;
  return `Week ${w} · ${d(mon)} – ${d(sun)}`;
}
function isoWeekMonday(y, w) {
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const dow = jan4.getUTCDay() || 7;
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - dow + 1 + (w - 1) * 7);
  return monday;
}

/** Horizontal bars. `metric` selects value/cartons; value bars show R, else units. */

/** Compact SVG area+line chart of the trend's value series. */
function trendChart(points) {
  if (!points || !points.length) return `<p class="ins-empty">Not enough dated statements to chart a trend.</p>`;
  if (points.length === 1) {
    const p = points[0];
    return `<p class="ins-empty">One period so far — <b>${esc(shortPeriod(p.period))}</b>: R ${fmt(p.value)}.</p>`;
  }
  const W = 520, H = 160, PAD = 28;
  const max = Math.max(...points.map(p => p.value), 0) || 1;
  const n = points.length;
  const x = i => PAD + (i * (W - PAD * 2)) / (n - 1);
  const y = v => H - PAD - (v / max) * (H - PAD * 2);
  const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${PAD},${H - PAD} ${line} ${(W - PAD)},${H - PAD}`;
  const dots = points.map((p, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3"><title>ZacoAgents</title></circle>`).join("");
  // Label only the first, middle and last period to avoid crowding.
  const idxs = [...new Set([0, Math.floor((n - 1) / 2), n - 1])];
  const labels = idxs.map(i =>
    `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="tx">${esc(shortPeriod(points[i].period))}</text>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="trend" preserveAspectRatio="xMidYMid meet" role="img">
    <polygon points="${area}" class="area"/>
    <polyline points="${line}" class="stroke"/>
    ${dots}
    <text x="${PAD}" y="14" class="tx">R ${fmt(max)}</text>
    ${labels}
  </svg></div>`;
}
function shortPeriod(p) {
  // "2026-07-27" -> "27 Jul" ; "2026-W31" -> "W31" ; "2026-07" -> "Jul"
  if (/^\d{4}-\d{2}-\d{2}$/.test(p)) {
    const [, m, d] = p.split("-").map(Number);
    return `${d} ${MONTHS[m - 1]}`;
  }
  if (/W\d+$/.test(p)) return p.split("-")[1];
  const [, m] = String(p).split("-");
  return m ? MONTHS[Number(m) - 1] : p;
}

/** Demo analytics when the API is offline: mirrors the backend's shape (incl.
 *  month/week filtering and available periods) over the same sample rows, so
 *  the dashboard is explorable without a backend. */
function demoAnalytics(month, week) {
  const all = [
    ...DEMO_EXISTING.map(r => ({ ...r, market: "TSHWANE MARKET", market_agent: "Farmers Trust", group_date: r.date })),
    ...DEMO_BATCHES.flat().map(r => ({ ...r, market: "JOBURG MKT", market_agent: "Subtropico", group_date: r.date_received })),
  ];
  const val = r => num(r.cartons_sold) * num(r.price);
  const car = r => num(r.cartons_sold);
  const ret = r => num(r.cartons_returned);
  const retVal = r => num(r.returns_total);
  // The product by its real name. The short code belongs to the Excel column,
  // not to the analytics -- it is assigned by hand, so grouping on it split one
  // fruit into two lines the moment a row had no code yet. Mirrors
  // `analytics.product_label`.
  const label = r => r.product || r.description || "Unknown";

  // Available periods (from all rows, so the pickers stay populated).
  const months = new Set(), weeks = new Set(), wbm = {};
  for (const r of all) {
    const mk = periodKey(r.group_date, "month"), wk = periodKey(r.group_date, "week");
    if (!mk) continue;
    months.add(mk); weeks.add(wk);
    (wbm[mk] = wbm[mk] || new Set()).add(wk);
  }
  const available = {
    months: [...months].sort(),
    weeks: [...weeks].sort(),
    weeks_by_month: Object.fromEntries(Object.entries(wbm).map(([m, s]) => [m, [...s].sort()])),
  };

  // Scope to the chosen month/week (week wins), then pick trend granularity.
  const rows = all.filter(r => {
    if (!month && !week) return true;
    const mk = periodKey(r.group_date, "month"), wk = periodKey(r.group_date, "week");
    if (week) return wk === week;
    return mk === month;
  });
  const period = week ? "day" : month ? "week" : "month";

  const roll = key => {
    const m = new Map();
    for (const r of rows) {
      const k = key(r) || "Unknown";
      const o = m.get(k) || { label: k, value: 0, cartons: 0, lines: 0 };
      o.value += val(r); o.cartons += car(r); o.lines++; m.set(k, o);
    }
    return [...m.values()].map(o => ({ ...o, value: round2(o.value), cartons: round2(o.cartons) }))
      .sort((a, b) => b.value - a.value);
  };
  const sellers = roll(label);
  const total = sellers.reduce((s, i) => s + i.value, 0) || 1;
  let before = 0;
  for (const i of sellers) {
    i.share = round4(i.value / total);
    before += i.value;
    i.cumulative_share = round4(before / total);
  }
  let cum = 0;
  for (const i of sellers) { i.abc = cum < 0.8 ? "A" : cum < 0.95 ? "B" : "C"; cum = i.cumulative_share; }
  const periods = new Map();
  for (const r of rows) {
    const pk = periodKey(r.group_date, period);
    if (!pk) continue;
    const o = periods.get(pk) || { period: pk, value: 0, cartons: 0 };
    o.value += val(r); o.cartons += car(r); periods.set(pk, o);
  }
  const trend = [...periods.values()].map(o => ({ ...o, value: round2(o.value), cartons: round2(o.cartons) }))
    .sort((a, b) => a.period < b.period ? -1 : 1);
  const dates = rows.map(r => r.group_date).filter(Boolean).sort();
  return {
    kpis: {
      total_value: round2(rows.reduce((s, r) => s + val(r), 0)),
      total_cartons: round2(rows.reduce((s, r) => s + car(r), 0)),
      gross_value: round2(rows.reduce((s, r) => s + val(r) + retVal(r), 0)),
      cartons_sold: round2(rows.reduce((s, r) => s + car(r) + ret(r), 0)),
      cartons_returned: round2(rows.reduce((s, r) => s + ret(r), 0)),
      returns_value: round2(rows.reduce((s, r) => s + retVal(r), 0)),
      return_rate: (() => {
        const sold = rows.reduce((s, r) => s + car(r) + ret(r), 0);
        return sold ? round4(rows.reduce((s, r) => s + ret(r), 0) / sold) : 0;
      })(),
      statement_count: rows.length,
      product_count: new Set(rows.map(label)).size,
      market_count: new Set(rows.map(r => r.market)).size,
      agent_count: new Set(rows.map(r => r.market_agent)).size,
      first_date: dates[0] || null,
      last_date: dates[dates.length - 1] || null,
    },
    best_sellers: sellers,
    by_market: roll(r => r.market),
    by_agent: roll(r => r.market_agent),
    trend, period, available, filter: { month: month || null, week: week || null },
  };
}
const round2 = n => Math.round(n * 100) / 100;
const round4 = n => Math.round(n * 10000) / 10000;
function periodKey(iso, period) {
  if (!iso) return null;
  const [y, m, dd] = String(iso).split("-").map(Number);
  if (period === "day") return `${y}-${String(m).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
  if (period === "month") return `${y}-${String(m).padStart(2, "0")}`;
  const dt = new Date(Date.UTC(y, m - 1, dd));
  const day = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
  return `${dt.getUTCFullYear()}-W${String(wk).padStart(2, "0")}`;
}

}

/** Split one figure across the rows it covers, in the ratio of their gross, so
 *  the shares add back up to it exactly. This is how the operator's own book
 *  splits a statement between the products on it. */
function splitByGross(total, rows) {
  const grosses = rows.map(r => num(r.cartons_sold) * num(r.price));
  const sum = grosses.reduce((a, b) => a + b, 0);
  const r2 = n => Math.round(n * 100) / 100;
  // Nothing sold under it yet, so there is no ratio: an equal share is the only
  // honest option.
  let shares = (rows.length === 1 || !sum)
    ? rows.map(() => r2(total / rows.length))
    : grosses.map(g => r2(total * (g / sum)));
  const residual = r2(total - shares.reduce((a, b) => a + b, 0));
  if (residual) {
    let biggest = 0;
    grosses.forEach((g, i) => { if (Math.abs(g) > Math.abs(grosses[biggest])) biggest = i; });
    shares[biggest] = r2(shares[biggest] + residual);
  }
  return shares;
}

/** Fill Nett onto every pending row whose statement appears in the round's
 *  adjustment reports, clearing the "enter Nett by hand" warning.
 *
 *  The report gives one figure per statement and a statement now covers several
 *  rows, one per product, so it is split between them. Writing the statement's
 *  whole Nett onto each row would multiply the money by the number of products. */
function applyNetts() {
  const map = S.nettMap || {};
  const groups = {};
  for (const r of S.pending) {
    const key = r.stm_no != null ? String(r.stm_no) : null;
    if (key && map[key] != null) (groups[key] ||= []).push(r);
  }
  for (const [key, rows] of Object.entries(groups)) {
    const shares = splitByGross(map[key], rows);
    rows.forEach((r, i) => {
      r.nett_total = shares[i];
      r.flags = (r.flags || []).filter(f => f.field !== "nett_total");
    });
  }
}

/** Live summary of Nett matching over the rows currently under review. */
function nettSummary() {
  if (!S.nettReports) return null;
  const map = S.nettMap || {};
  const pendingStms = new Set(
    S.pending.map(r => (r.stm_no != null ? String(r.stm_no) : null)).filter(Boolean));
  const matched = S.pending.filter(r => r.stm_no != null && map[String(r.stm_no)] != null).length;
  const unused = Object.keys(map).filter(k => !pendingStms.has(k)).length;
  return {
    reports: S.nettReports,
    statements: Object.keys(map).length,
    matched,
    unmatched: S.pending.length - matched,
    unused,
  };
}

/** The uploaded file a row came from, stripped of the "· consignment N" /
 *  "· statement N of M" / "· product N of M" / "(statement N of M)" suffixes the
 *  extractor adds. Anchors on the keyword so it doesn't depend on the exact
 *  separator char.
 *
 *  Stripped in a loop because they stack: one consignment settled under two
 *  account sales is "june.csv · consignment 1 · statement 1 of 2". Peeling one
 *  suffix only would leave every row with a name of its own, so a file of 70
 *  rows would show 70 chips and none of them would remove anything. */
const FILE_SUFFIXES = [
  /\s*[·•∙|-]?\s*consignment\s+\d+\s*$/i,
  /\s*[·•∙|-]?\s*statement\s+\d+\s+of\s+\d+\s*$/i,
  /\s*[·•∙|-]?\s*product\s+\d+\s+of\s+\d+\s*$/i,
  /\s*\(statement\s+\d+\s+of\s+\d+\)\s*$/i,
];

function baseFile(r) {
  let name = String(r.source_file || "Statements");
  for (let peeled = true; peeled; ) {
    peeled = false;
    for (const suffix of FILE_SUFFIXES) {
      const shorter = name.replace(suffix, "");
      if (shorter !== name) { name = shorter; peeled = true; }
    }
  }
  return name.trim();
}

/** Removable chips, one per uploaded PDF in the current round. */
function pdfChips(pool) {
  const groups = {};
  for (const r of pool) { const n = baseFile(r); groups[n] = (groups[n] || 0) + 1; }
  const names = Object.keys(groups);
  if (!names.length) return "";
  return `<div class="pdf-chips">${names.map(n => `
    <span class="pchip" data-name="${esc(n)}">
      <span class="pci">▤</span>
      <span class="pcn" title="${esc(n)}">${esc(n)}</span>

      <button class="pcx" title="Remove this PDF" onclick="removePdf(this.closest('.pchip').dataset.name)">×</button>
    </span>`).join("")}</div>`;
}

        <div class="big">↑</div><div class="t">${pool.length} statement row${pool.length === 1 ? "" : "s"} read</div>
        <div class="s">Drop more reports to include them in this round before appending</div>
      </div>

      ${pdfChips(pool)}

      <div class="summary" style="margin-top:20px">
        <div class="stat"><div class="n">${pool.length}</div><div class="l">New rows</div></div>
        <div class="stat ${attn ? "warn" : ""}"><div class="n">${attn}</div><div class="l">Need attention</div></div>
        <div class="stat"><div class="n">${dns.length}</div><div class="l">DN group${dns.length === 1 ? "" : "s"}</div></div>
        <div class="stat"><div class="n">${dns.map(d => groupDate(d, pool)).join(", ") || "—"}</div><div class="l">Batch date${dns.length === 1 ? "" : "s"}</div></div>
      </div>

      ${S.importWarnings.map(w => `<div class="banner bad"><span class="bi">!</span><span><b>This export may not be the whole picture.</b> ${esc(w)}</span></div>`).join("")}

      ${ns ? `<div class="banner ${ns.matched ? "" : "bad"}"><span class="bi">${ns.matched ? "✓" : "!"}</span>
        <span><b>Nett filled on ${ns.matched} of ${pool.length} row${pool.length === 1 ? "" : "s"}</b> from ${ns.reports} adjustment report${ns.reports === 1 ? "" : "s"} (${ns.statements} statement${ns.statements === 1 ? "" : "s"}).${ns.unmatched ? ` ${ns.unmatched} row${ns.unmatched === 1 ? "" : "s"} had no matching statement — those Netts stay to be entered by hand.` : ""}${ns.unused ? ` ${ns.unused} adjustment entr${ns.unused === 1 ? "y" : "ies"} didn't match any row here.` : ""}</span></div>` : ""}

      ${dupes ? `<div class="banner bad"><span class="bi">!</span>
        <span><b>${dupes} row${dupes === 1 ? " is" : "s are"} already in your saved history.</b>
        Appending ${dupes === 1 ? "it" : "them"} again will duplicate ${dupes === 1 ? "it" : "them"}.
        <button class="linklike" onclick="removeDuplicates()">Remove already-saved row${dupes === 1 ? "" : "s"}</button>, or keep ${dupes === 1 ? "it" : "them"} if you're re-processing a correction.</span></div>` : ""}

      ${tableBlock(pool, { editable: true })}

      <div class="actions">
        <button class="btn ghost" onclick="cancelAdd()">Cancel</button>
        <span class="spacer"></span>
        ${attn ? `<div class="hint" style="color:var(--warn)">Resolve ${attn} flagged row${attn === 1 ? "" : "s"} to continue</div>` : ""}
        <button class="btn primary" onclick="appendRows()" ${attn ? "disabled" : ""}>Add ${pool.length} row${pool.length === 1 ? "" : "s"}</button>
      </div>
    </section>`;

  // Typing a new code should start immediately, without hunting for the box.
  document.getElementById("newCode" + S.newCodeFor)?.focus();
}

function cancelAdd() { S.pending = []; S.nettMap = {}; S.nettReports = 0; S.newCodeFor = null; S.importWarnings = []; go("hub"); }

/** Drop rows already present in the saved history, so the same PDF is not
 *  appended to the workbook twice. */
function removeDuplicates() {
  const before = S.pending.length;
  S.pending = S.pending.filter(r => !isDuplicate(r));
  const removed = before - S.pending.length;
  toast(`Removed ${removed} already-saved row${removed === 1 ? "" : "s"}`);
  if (!S.pending.length) return go("hub");
  render();
}

function appendRows() {
  const n = S.pending.length;
  S.committed = S.committed.concat(S.pending.map(r => ({ ...r, isNew: true })));
  S.pending = []; S.nettMap = {}; S.nettReports = 0; S.newCodeFor = null; S.importWarnings = []; S.saved = false;
  toast(`${n} row${n === 1 ? "" : "s"} added · unsaved`);
  go("hub");
}

const NEW_CODE = "__new__";   // sentinel option value in the code dropdown

/** Switch a row's code cell into "type a brand-new code" mode. */
function startNewCode(idx) { S.newCodeFor = idx; renderReview(); }
function cancelNewCode() { S.newCodeFor = null; renderReview(); }

/** Save a short code the operator just invented, then use it. */
async function saveNewCode(idx, raw) {
  const code = (raw || "").trim();
  if (!code) { toast("Type a short code first", true); return; }
  S.newCodeFor = null;
  await resolveCode(idx, code);
}

/** Resolve a flagged description by picking a code; remembered for next time.
 *  Applies to every pending row with the same product, since a batch usually
 *  carries several consignments of it and they all take the same code. */
async function resolveCode(idx, code) {
  if (!code) return;
  if (code === NEW_CODE) return startNewCode(idx);

  const row = S.pending[idx];
  const sameProduct = S.pending.filter(r => r.product && r.product === row.product);
  const targets = sameProduct.length ? sameProduct : [row];
  for (const r of targets) {
    r.description = code;
    r.flags = (r.flags || []).filter(f => f.field !== "description");
  }
  if (!S.codes.includes(code)) S.codes.push(code);

  if (S.live && row.product) {
    try {
      await api("/api/lookup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product: row.product, code }),
      });
    } catch (e) {
      toast("Used here, but could not save it for next time: " + e.message, true);
      renderReview();
      return;
    }
  }
  const also = targets.length > 1 ? ` · applied to ${targets.length} rows` : "";
  toast(`Saved “${code}” for this product${also}`);
  renderReview();
}

/** Correct a flagged numeric/text field inline. */
function editField(idx, field, raw) {
  const row = S.pending[idx];
  const value = raw.trim();
  if (value === "") return;
  if (field === "status") {
    row[field] = value;
  } else {
    // Anything that is not a number leaves the field unknown rather than
    // becoming 0: stripping the non-digits out of "n/a" leaves an empty string,
    // and Number("") is 0 -- which is how two rows ended up claiming to be
    // statement number 0. A zero statement or DN is not a correction, so the
    // flag stays on and the cell stays open for a real answer.
    const parsed = Number(value.replace(/[^\d.-]/g, ""));
    const unusable = !Number.isFinite(parsed)
      || ((field === "stm_no" || field === "dn") && parsed === 0);
    if (unusable) { renderReview(); return; }
    row[field] = parsed;
    // The DN belongs to the whole delivery, not to one account sale. Correcting
    // it on one row and leaving its siblings on the market's Supplier Ref is how
    // a delivery ends up split across two DNs in the sheet, so it carries over
    // to every row of the same delivery. The backend remembers it on save.
    if (field === "dn" && row.delivery_id != null) {
      for (const other of S.pending) {
        if (other !== row && other.delivery_id === row.delivery_id) {
          other.dn = parsed;
          other.flags = (other.flags || []).filter(f => f.code !== "dn_unproven");
        }
      }
    }
  }
  row.flags = (row.flags || []).filter(f => f.field !== field);
  renderReview();
}

// -------------------------------------------------------------- saving

/** Record the reviewed rows. There is no file: the app's own store is the book
 *  now, and every view reads back from it. */
async function saveRows() {
  const fresh = S.committed.filter(r => !r.existing);
  if (!fresh.length) { toast("Nothing new to save"); return; }

  if (!S.live) {
    S.committed = S.committed.map(r => ({ ...r, existing: true, isNew: false }));
    S.saved = true;
    toast(`Saved ${fresh.length} row${fresh.length === 1 ? "" : "s"}`);
    renderHub();
    return;
  }

  await withBusy("Saving…", async () => {
    const fd = new FormData();
    fd.append("rows", JSON.stringify(fresh));
    fd.append("market_agent", S.agent);
    const out = await (await api("/api/sales/save", { method: "POST", body: fd })).json();
    S.committed = S.committed.map(r => ({ ...r, existing: true, isNew: false }));
    S.saved = true;
    S.screen = "hub";
    toast(`Saved ${out.saved} row${out.saved === 1 ? "" : "s"}`);
    if (out.warning) toast(out.warning, true);
  });
}

/** New sales change what is worth buying, so the app says what moved rather
 *  than waiting to be asked. Diffed against the levels held before the save;
 *  only promotions are reported, since a line falling back is not something to
 *  act on this morning. */

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// --------------------------------------------------------------- table
function tableBlock(rows, { editable }) {
  const pool = rows;
  const sorted = [...rows].map((r, i) => ({ r, i }))
    .sort((a, b) => (a.r.dn ?? 0) - (b.r.dn ?? 0) || (a.r.stm_no ?? 0) - (b.r.stm_no ?? 0));

  let html = "", lastDn = Symbol("none");
  for (const { r, i } of sorted) {
    if (r.dn !== lastDn) {
      lastDn = r.dn;
      html += `<tr class="group-row"><td colspan="${COLS.length}">
        <span class="dn num">DN ${r.dn ?? "—"}</span>
        <span class="meta"> · ${esc(r.market_agent || S.agent)}</span>
        <span class="date-badge">Date <span class="num">${groupDate(r.dn, pool)}</span></span>
        ${r.existing ? '<span class="tag existing">in workbook</span>' : (editable ? "" : '<span class="tag new">added</span>')}
      </td></tr>`;
    }
    html += `<tr class="${!editable ? "" : (needsAttention(r) ? "attn" : "")} ${r.existing ? "existing" : ""}">`
      + COLS.map(c => cellHtml(c, r, i, pool, editable)).join("") + "</tr>";
  }

  const legend = `<div class="legend">
    <span><span class="sw" style="background:var(--surface-2);border:1px solid var(--line-strong)"></span> extracted / manual</span>
    <span><span class="fmark" style="font-style:italic">ƒ</span> template formula (auto-calculated)</span>
    ${editable ? '<span><span class="sw" style="background:var(--warn-tint);border:1px solid var(--warn)"></span> needs attention</span>' : ""}
  </div>`;

  return legend + `<div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>${COLS.map(c => `<th class="${c.cls || ""} ${c.f ? "f" : ""}">${c.h}${c.f ? ' <span class="fmark">ƒ</span>' : ""}</th>`).join("")}</tr></thead>
    <tbody>${html}</tbody></table></div></div>`;
}

function cellHtml(c, r, i, pool, editable) {
  if (c.desc) {
    const raw = r.product ? `<span class="prod-raw" title="${esc(r.product)}">${esc(r.product)}</span>` : "";
    if (editable) {
      // Naming a brand-new code for this row: the picker becomes a text box.
      // New products arrive constantly, so this has to be quick, not a detour.
      if (S.newCodeFor === i) {
        return `<td class="flagged">
          <span class="newcode">
            <input class="cell-input newcode-in" id="newCode${i}" placeholder="New short code…"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();saveNewCode(${i}, this.value);}
                              else if(event.key==='Escape'){cancelNewCode();}">
            <button class="btn primary sm" onclick="saveNewCode(${i}, document.getElementById('newCode${i}').value)">Save</button>
            <button class="btn ghost sm" onclick="cancelNewCode()">Cancel</button>
          </span>
          ${raw}<span class="flag-note">Give it a short code, e.g. “Imp Granadillas”. It's remembered for next time.</span></td>`;
      }
      // Otherwise a dropdown, pre-selected to the auto-picked code so it self-
      // selects but stays changeable. The current code is included even if it
      // isn't in the known list yet. Only flag when nothing was picked.
      const options = [...new Set([...(r.description ? [r.description] : []), ...S.codes])];
      const opts = `<option value="">Pick code…</option>`
        + options.map(k => `<option${k === r.description ? " selected" : ""}>${esc(k)}</option>`).join("")
        + `<option value="${NEW_CODE}">＋ New code…</option>`;
      const note = r.description
        ? ""
        : `<span class="flag-note">No short code on file. Pick one, or add a new code.</span>`;
      return `<td class="${r.description ? "" : "flagged"}">
        <select class="mini-select${r.description ? " set" : ""}" onchange="resolveCode(${i}, this.value)">${opts}</select>
        ${raw}${note}</td>`;
    }
    return `<td><b>${esc(r.description || "—")}</b>${raw}</td>`;
  }

  const flag = c.field ? flagFor(r, c.field) : null;
  if (flag && editable) {
    // Error flags block the append until resolved; warning flags are advisory
    // (the value below already stands -- e.g. a nett left at 0) but stay
    // editable so the share can be typed in right here.
    const current = r[c.field];
    return `<td class="${c.cls || ""} flagged">
      <input class="cell-input" value="${current == null ? "" : esc(current)}" placeholder="—"
             onchange="editField(${i}, '${c.field}', this.value)">
      <span class="flag-note">${esc(flag.message)}</span></td>`;
  }
  // The statement number is where an agent-watch flag belongs on this screen:
  // it is the cell the concern is about, and it puts the question in front of
  // the operator while they are still looking at the round.
  if (c.field === "stm_no") {
    return `<td class="${c.cls || ""}">${c.get(r, pool)}${watchChip(r.stm_no)}</td>`;
  }
  return `<td class="${c.cls || ""} ${c.f ? "f" : ""}">${c.get(r, pool)}</td>`;
}

// ------------------------------------------------------- toast + theme
let toastT;
function toast(msg, bad) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastT);
  toastT = setTimeout(() => t.remove(), bad ? 5200 : 2600);
}
// -------------------------------------------------------- file inputs
const pdfInput = document.getElementById("pdfInput");
pdfInput.addEventListener("change", e => {
  const files = [...e.target.files];
  pdfInput.value = "";
  if (files.length) onPdfFiles(files);
});
const paymentInput = document.getElementById("paymentInput");
paymentInput.addEventListener("change", e => {
  const files = [...e.target.files];
  paymentInput.value = "";
  if (files.length) onPaymentFiles(files);
});

// ------------------------------------------------------- drag and drop
// Dropping works anywhere on the page: statement PDFs land in the current
// round, a workbook dropped on the setup screen opens it. Dropped workbooks
// keep a file handle where the browser supports it, so Save still writes
// straight back to the original file.
// PDF or CSV: the CSV exports of the same reports are preferred where
// available, since their values are read rather than recovered from layout.
const isPdf = f => /\.(pdf|csv)$/i.test(f.name) || f.type === "application/pdf" || f.type === "text/csv";

let dragDepth = 0;
function dropHighlight(on) {
  document.querySelectorAll(".drop").forEach(el => el.classList.toggle("over", on));
}
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragenter", e => {
  if ([...(e.dataTransfer?.types || [])].includes("Files")) {
    dragDepth++;
    dropHighlight(true);
  }
});
document.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; dropHighlight(false); }
});
document.addEventListener("drop", async e => {
  e.preventDefault();
  dragDepth = 0;
  dropHighlight(false);

  const authShowing = !document.getElementById("authWrap")?.hidden;
  if (authShowing && S.authRequired) return;   // nothing to drop onto before sign-in

  // dataTransfer.items is cleared after the first await, so anything we need
  // from it -- the files and any file handles -- must be captured up front.
  const items = [...(e.dataTransfer?.items || [])];
  const files = [...(e.dataTransfer?.files || [])];
  if (!files.length) return;
  const handlePromises = items.map(i =>
    i.kind === "file" && i.getAsFileSystemHandle
      ? i.getAsFileSystemHandle().catch(() => null)
      : Promise.resolve(null)
  );
  const itemNames = items.map(i => (i.kind === "file" ? i.getAsFile()?.name : null));

  const pdfs = files.filter(isPdf);

  if (pdfs.length) {
    if (S.module !== "sales") { toast("Open Sales & Payments, then drop the reports in"); return; }
    onPdfFiles(pdfs);
    return;
  }

  toast("Drop a daily sales report or a payment details file");
});

// ------------------------------------------------------------- start
/** Runs once a session exists (or auth is off): loads data and shows the app. */
async function startApp() {
  const wrap = document.getElementById("authWrap");
  if (wrap) wrap.hidden = true;
  document.querySelector(".app").hidden = false;

  if (S.authRequired) {
    try {
      const me = await (await api("/api/me")).json();
      Auth.profile = me;
    } catch {
      // Not fatal: the app still works, we just cannot show the role badge.
      Auth.profile = null;
    }
  }
  showUserChip();
  await loadCodes();
  render();
}

(async function init() {
  await checkHealth();

  if (!S.authRequired) {
    // Demo mode, or a local run with auth switched off.
    await startApp();
    return;
  }

  Auth.load();

  // An invite or password-reset link arrives with tokens in the fragment.
  const linkType = consumeAuthFragment();
  if (linkType) {
    renderAuth("invite", linkType === "recovery"
      ? "Choose a new password to finish resetting your account."
      : "Welcome — set a password to activate your account.");
    return;
  }

  if (await Auth.validToken()) await startApp();
  else renderAuth("signin");
})();
</script>
